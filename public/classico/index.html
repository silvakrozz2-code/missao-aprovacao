to a simples alega\xE7\xE3o de injusti\xE7a","\xC9 proibida ap\xF3s a demiss\xE3o"],0,"Arts. 252 e 261, par\xE1grafo \xFAnico. Simples alega\xE7\xE3o de injusti\xE7a n\xE3o basta (art. 252, \xA7 3\xBA).",!0],[g,2,"Pela Lei 1.656/1958, o funcion\xE1rio respondendo a processo administrativo pode ser exonerado a pedido:",["S\xF3 depois da conclus\xE3o do processo e de reconhecida sua inoc\xEAncia","A qualquer momento","Apenas antes da cita\xE7\xE3o","Nunca mais","Com autoriza\xE7\xE3o da C\xE2mara"],0,"Art. 221, par\xE1grafo \xFAnico, e art. 247 da Lei 1.656/1958.",!1],[g,2,"Sobre f\xE9rias, a Lei 1.656/1958 prev\xEA:",["30 dias consecutivos por ano, sendo proibida a acumula\xE7\xE3o, salvo necessidade imperiosa do servi\xE7o e no m\xE1ximo dois per\xEDodos","20 dias \xFAteis, acumul\xE1veis livremente","30 dias, podendo descontar faltas das f\xE9rias","45 dias para todos","15 dias, sem possibilidade de acumula\xE7\xE3o"],0,"Arts. 152 e 155. \xC9 proibido levar \xE0 conta de f\xE9rias qualquer falta ao trabalho (art. 152, \xA7 1\xBA).",!1],[g,1,"Segundo a Lei 7.671/1991, a administra\xE7\xE3o indireta do Munic\xEDpio de Curitiba compreende:",["Autarquias, funda\xE7\xF5es p\xFAblicas, empresas p\xFAblicas, sociedades de economia mista e funda\xE7\xF5es estatais de direito privado","Somente secretarias municipais","Somente autarquias","\xD3rg\xE3os colegiados e de assessoramento","C\xE2mara Municipal e suas comiss\xF5es"],0,"Art. 1\xBA, \xA7 4\xBA, I a V da Lei 7.671/1991 (o inciso V foi inclu\xEDdo pela Lei 13.663/2010).",!0],[g,2,"Na Lei 7.671/1991, as Secretarias Municipais s\xE3o classificadas em:",["Natureza meio e natureza fim, como \xF3rg\xE3os de primeiro n\xEDvel hier\xE1rquico","Aut\xE1rquicas e fundacionais","Federais e estaduais","Permanentes e eleitas","Consultivas e judiciais"],0,"Art. 1\xBA, \xA7 3\xBA, III da Lei 7.671/1991.",!0],[g,2,"O IPPUC (Instituto de Pesquisa e Planejamento Urbano de Curitiba) \xE9, segundo a Lei 7.671/1991:",["Autarquia","Sociedade de economia mista","Secretaria Municipal","Funda\xE7\xE3o estatal de direito privado","\xD3rg\xE3o colegiado"],0,"Art. 2\xBA, II, a. A URBS e a COHAB-CT s\xE3o sociedades de economia mista (al\xEDnea c); FAS e FCC s\xE3o funda\xE7\xF5es p\xFAblicas (al\xEDnea b).",!0],[g,3,"Al\xE9m das Secretarias previstas em lei, o Prefeito pode instalar, por decreto, Secretarias Municipais de Natureza Extraordin\xE1ria, para assuntos de import\xE2ncia ou dura\xE7\xE3o transit\xF3ria, at\xE9 o limite de:",["6","3","10","2","Sem limite"],0,"Art. 3\xBA da Lei 7.671/1991 (reda\xE7\xE3o da Lei 12.192/2007).",!1],[g,3,"A Lei 16.763/2026, que criou o Programa Municipal de Parcerias Estrat\xE9gicas, alterou a Lei 7.671/1991 para incluir entre as sociedades de economia mista:",["A PARS S.A.","A URBS","A COHAB-CT","O IPPUC","A Funda\xE7\xE3o Cultural de Curitiba"],0,"Lei 16.763/2026, art. 28, I: acrescenta o item 6 (PARS S.A.) \xE0 al\xEDnea c do inciso II do art. 2\xBA da Lei 7.671/1991. URBS e COHAB-CT j\xE1 constavam.",!1]],so=[["Lei 16.466/2024: prazos","Ato sem prazo: 5 dias \xFAteis (+5). Intima\xE7\xE3o: 3 dias \xFAteis antes. Decis\xE3o: 30 dias \xFAteis (m\xE1x. 6 meses). Recurso: 15 dias \xFAteis, um s\xF3.",g],["Lei 16.466/2024: defesa e certid\xE3o","Defesa em processo sancionat\xF3rio: 10 dias \xFAteis. Novos documentos: 5 dias \xFAteis. Certid\xE3o eletr\xF4nica: at\xE9 10 dias \xFAteis.",g],["Lei 16.466/2024: intima\xE7\xE3o eletr\xF4nica","Lida: vale no dia \xFAtil seguinte \xE0 consulta. N\xE3o lida: vale ap\xF3s 10 dias cont\xEDnuos. Edital: 3 dias \xFAteis ap\xF3s publicar.",g],["Lei 16.466/2024: impedimento \xD7 suspei\xE7\xE3o","IMPEDIDO: interesse na mat\xE9ria ou lit\xEDgio com o interessado. SUSPEITO: amizade \xEDntima ou inimizade not\xF3ria.",g],["Lei 16.466/2024: anular, revogar, convalidar","Anula ilegal (decai em 5 anos, salvo m\xE1-f\xE9). Revoga por conveni\xEAncia. Convalida defeito san\xE1vel sem preju\xEDzo.",g],["Lei 16.466/2024: recesso","Prazos suspensos de 20/12 a 20/01 (art. 75). Urg\xEAncias: plant\xE3o.",g],["Lei 16.466/2024: reconsidera\xE7\xE3o","Contra decis\xE3o da autoridade m\xE1xima sem recurso hier\xE1rquico: 15 dias \xFAteis, \xE0 pr\xF3pria autoridade, uma vez s\xF3, sem agravar pena.",g],["Lei Org\xE2nica: Poderes","Legislativo (C\xE2mara) e Executivo (Prefeito + Secret\xE1rios). Munic\xEDpio n\xE3o tem Judici\xE1rio.",g],["Lei Org\xE2nica: Prefeito","Viagem > 15 dias: autoriza\xE7\xE3o da C\xE2mara. Informa\xE7\xF5es \xE0 C\xE2mara: 15 dias \xFAteis. Contas: at\xE9 90 dias ap\xF3s o exerc\xEDcio.",g],["Lei Org\xE2nica: substitui\xE7\xE3o do Prefeito","Vice \u2192 Presidente da C\xE2mara \u2192 1\xBA e 2\xBA Vice-Presidentes \u2192 demais da Mesa \u2192 vereadores mais votados.",g],["Lei Org\xE2nica: data magna","29 de mar\xE7o (anivers\xE1rio de Curitiba).",g],["Lei 1.656/1958: penas","Advert\xEAncia (verbal, neglig\xEAncia), repreens\xE3o (escrita), suspens\xE3o (at\xE9 90 dias), multa, destitui\xE7\xE3o de fun\xE7\xE3o, demiss\xE3o.",g],["Lei 1.656/1958: abandono","Mais de 30 dias seguidos ou 90 intercalados no ano: demiss\xE3o.",g],["Lei 1.656/1958: sindic\xE2ncia e PAD","Sindic\xE2ncia: 3 est\xE1veis, come\xE7a em 3 dias, acaba em 15. PAD: 60 + 30 dias, defesa em 20, decis\xE3o em 20.",g],["Lei 1.656/1958: prescri\xE7\xE3o e suspens\xE3o preventiva","Faltas leves prescrevem em 4 anos. Suspens\xE3o preventiva: 30 dias, at\xE9 90; perde 1/3 do vencimento.",g],["Lei 7.671/1991: indireta","Autarquias (IPPUC, IMAP, IPMC, Curitiba Turismo), funda\xE7\xF5es (FCC, FAS), economia mista (COHAB, URBS...) e funda\xE7\xF5es estatais.",g]];var X="https://www.planalto.gov.br/ccivil_03/",$e={id:"concurso",nome:"Concurso Curitiba",sub:"Agente Administrativo \xB7 FAFIPA",dataPadrao:"2026-12-15",codigo:"CTBA \xB7 ED. 4/2026",cor:"concurso",materias:[{id:"esp",nome:"Conhecimentos Espec\xEDficos",peso:50,temas:["Administra\xE7\xE3o P\xFAblica","Atos administrativos","Bens e servi\xE7os p\xFAblicos","Licita\xE7\xF5es (Lei 14.133)","Responsabilidade e PAD","Direito Constitucional","\xC9tica e atendimento","Arquivologia","Reda\xE7\xE3o oficial","M\xE9todos de pesquisa","Or\xE7amento p\xFAblico","Gest\xE3o de pessoas"]},{id:"port",nome:"L\xEDngua Portuguesa",peso:12.5,temas:["Uso dos porqu\xEAs","Crase","Concord\xE2ncia","Acentua\xE7\xE3o","Pontua\xE7\xE3o","Conectivos e coes\xE3o","Sem\xE2ntica e figuras","Fun\xE7\xF5es da linguagem","Literatura brasileira"]},{id:"rl",nome:"Racioc\xEDnio L\xF3gico",peso:12.5,gerado:!0},{id:"info",nome:"No\xE7\xF5es de Inform\xE1tica",peso:12.5,temas:["Atalhos do Windows","Word 2016","Excel 2016","Linux Ubuntu","Seguran\xE7a da informa\xE7\xE3o","Internet, e-mail e nuvem","Hardware e software","IA generativa"]},{id:"leg",nome:"Legisla\xE7\xE3o",peso:12.5,temas:["CF: princ\xEDpios fundamentais (arts. 1\xBA a 4\xBA)","CF: direitos e garantias (arts. 5\xBA a 17)","CF: organiza\xE7\xE3o do Estado (arts. 18, 19, 29, 30)","CF: Administra\xE7\xE3o P\xFAblica (arts. 37 a 41)","CF: Poder Legislativo (arts. 44 a 75)","Improbidade (Lei 8.429)","Acesso \xE0 informa\xE7\xE3o (LAI)","Prioridade de atendimento (Lei 10.048)","ECA","LINDB (arts. 20 a 30)","LGPD (Cap. IV)","Leis de Curitiba"]}],resumos:{"Administra\xE7\xE3o P\xFAblica":{t:["Administra\xE7\xE3o DIRETA = os pr\xF3prios entes (Uni\xE3o, Estados, DF, Munic\xEDpios) e seus \xF3rg\xE3os (secretarias, por exemplo). \xD3rg\xE3o n\xE3o tem personalidade jur\xEDdica.","Administra\xE7\xE3o INDIRETA = pessoas jur\xEDdicas criadas pelo ente: autarquias, funda\xE7\xF5es p\xFAblicas, empresas p\xFAblicas e sociedades de economia mista.","DESCONCENTRA\xC7\xC3O: distribui tarefas DENTRO da mesma pessoa jur\xEDdica (cria \xF3rg\xE3os, h\xE1 hierarquia). DESCENTRALIZA\xC7\xC3O: passa a tarefa para OUTRA pessoa (autarquia, empresa, concession\xE1ria).","Fun\xE7\xF5es da administra\xE7\xE3o (PODC): Planejamento, Organiza\xE7\xE3o, Dire\xE7\xE3o e Controle.","Princ\xEDpios expressos no art. 37 da CF: LIMPE = Legalidade, Impessoalidade, Moralidade, Publicidade e Efici\xEAncia.","Poderes administrativos: hier\xE1rquico (dar ordens, rever atos), disciplinar (punir servidores e quem tem v\xEDnculo especial), regulamentar (decretos para fiel execu\xE7\xE3o da lei) e de pol\xEDcia (limitar a liberdade individual em favor do interesse p\xFAblico, como multa de tr\xE2nsito e fiscaliza\xE7\xE3o sanit\xE1ria).","5S (organiza\xE7\xE3o do ambiente de trabalho): Seiri (utiliza\xE7\xE3o/descarte), Seiton (ordena\xE7\xE3o), Seiso (limpeza), Seiketsu (padroniza\xE7\xE3o/sa\xFAde) e Shitsuke (disciplina)."],cai:"LIMPE, PODC, diferen\xE7a entre desconcentra\xE7\xE3o e descentraliza\xE7\xE3o e quem \xE9 Administra\xE7\xE3o indireta.",macete:"DesCONcentra\xE7\xE3o fica CONsigo (mesma pessoa). DesCENtraliza\xE7\xE3o manda para outro CENtro (outra pessoa jur\xEDdica)."},"Atos administrativos":{t:["Elementos (requisitos) do ato: COmpet\xEAncia, FInalidade, FOrma, MOtivo e OBjeto (COFIFOMOB). Compet\xEAncia, finalidade e forma s\xE3o vinculados; motivo e objeto podem ser discricion\xE1rios.","Atributos: Presun\xE7\xE3o de legitimidade, Autoexecutoriedade, Tipicidade e Imperatividade (PATI).","ANULA\xC7\xC3O: por ilegalidade, feita pela Administra\xE7\xE3o ou pelo Judici\xE1rio, efeitos retroativos (ex tunc).","REVOGA\xC7\xC3O: por conveni\xEAncia e oportunidade (ato legal que deixou de ser \xFAtil), feita s\xF3 pela pr\xF3pria Administra\xE7\xE3o, efeitos dali para frente (ex nunc).","S\xFAmula 473 do STF: a Administra\xE7\xE3o pode anular seus atos ilegais e revogar os inconvenientes, respeitados os direitos adquiridos.","Ato vinculado: a lei n\xE3o deixa escolha. Ato discricion\xE1rio: a lei deixa margem de escolha dentro dos limites legais."],cai:"Diferen\xE7a entre anular e revogar, e os 5 elementos do ato.",macete:"ANULA o que \xE9 ILEGAL (pensa em 'A-I'). REVOGA o que \xE9 legal, mas n\xE3o conv\xE9m mais."},"Bens e servi\xE7os p\xFAblicos":{t:["Bens de USO COMUM do povo: ruas, pra\xE7as, rios, praias. Bens de USO ESPECIAL: pr\xE9dios onde funciona o servi\xE7o (escola, hospital, prefeitura). Bens DOMINICAIS: patrim\xF4nio sem destina\xE7\xE3o p\xFAblica (terreno vazio do munic\xEDpio).","Caracter\xEDsticas: inalienabilidade relativa (dominicais podem ser vendidos, cumpridas as exig\xEAncias da lei), impenhorabilidade, imprescritibilidade (n\xE3o sofrem usucapi\xE3o) e n\xE3o onerabilidade.","Servi\xE7o adequado (Lei 8.987, art. 6\xBA): regularidade, continuidade, efici\xEAncia, seguran\xE7a, atualidade, generalidade, cortesia na presta\xE7\xE3o e modicidade das tarifas.","Presta\xE7\xE3o direta (pelo pr\xF3prio ente) ou indireta (concess\xE3o ou permiss\xE3o, sempre precedidas de licita\xE7\xE3o)."],cai:"Classifica\xE7\xE3o dos bens (dominical \xE9 o que mais confunde) e o fato de bem p\xFAblico n\xE3o sofrer usucapi\xE3o.",macete:"DOMINICAL = 'dispon\xEDvel'. \xC9 o \xFAnico que pode ser vendido sem antes ser desafetado."},"Licita\xE7\xF5es (Lei 14.133)":{t:["Modalidades (art. 28): preg\xE3o, concorr\xEAncia, concurso, leil\xE3o e di\xE1logo competitivo. Tomada de pre\xE7os e convite N\xC3O existem mais.","Preg\xE3o: bens e servi\xE7os comuns, crit\xE9rio menor pre\xE7o ou maior desconto.","Concurso: escolha de trabalho t\xE9cnico, cient\xEDfico ou art\xEDstico, com pr\xEAmio ou remunera\xE7\xE3o ao vencedor.","Leil\xE3o: aliena\xE7\xE3o (venda) de bens im\xF3veis ou de bens m\xF3veis inserv\xEDveis ou legalmente apreendidos, crit\xE9rio maior lance.","Di\xE1logo competitivo: contrata\xE7\xF5es com inova\xE7\xE3o t\xE9cnica ou tecnol\xF3gica, em que a Administra\xE7\xE3o dialoga com licitantes pr\xE9-selecionados.","Fases (art. 17), em regra: preparat\xF3ria, divulga\xE7\xE3o do edital, apresenta\xE7\xE3o de propostas e lances, julgamento, habilita\xE7\xE3o, recursal e homologa\xE7\xE3o. O julgamento vem ANTES da habilita\xE7\xE3o.","Contrata\xE7\xE3o direta: DISPENSA (a competi\xE7\xE3o \xE9 poss\xEDvel, mas a lei permite n\xE3o licitar) e INEXIGIBILIDADE (competi\xE7\xE3o invi\xE1vel, como fornecedor exclusivo)."],cai:"As 5 modalidades e a pegadinha de citar 'tomada de pre\xE7os' ou 'convite' como modalidade vigente.",macete:"Modalidades: 'PreCon CoLeDi' = PREg\xE3o, CONcorr\xEAncia, COncurso, LEil\xE3o, DI\xE1logo.",lei:X+"_ato2019-2022/2021/lei/l14133.htm"},"Responsabilidade e PAD":{t:["Responsabilidade do Estado (CF, art. 37, \xA76\xBA): OBJETIVA. A v\xEDtima n\xE3o precisa provar culpa, s\xF3 o dano e o nexo causal.","O servidor responde por a\xE7\xE3o de REGRESSO, se agiu com dolo ou culpa.","As responsabilidades civil, penal e administrativa s\xE3o independentes. A absolvi\xE7\xE3o penal por inexist\xEAncia do fato ou negativa de autoria afasta a responsabilidade administrativa.","Processo Administrativo Disciplinar (PAD): fases de instaura\xE7\xE3o, inqu\xE9rito (instru\xE7\xE3o, defesa e relat\xF3rio) e julgamento. Sempre com contradit\xF3rio e ampla defesa (CF, art. 5\xBA, LV).","Em Curitiba, o regime disciplinar dos servidores est\xE1 no Estatuto (Lei Municipal 1.656/1958). Leia os artigos de deveres, proibi\xE7\xF5es e penalidades no texto oficial."],cai:"Responsabilidade objetiva do Estado x regresso contra o servidor com dolo ou culpa.",macete:"Estado paga SEM discutir culpa. Depois cobra do servidor S\xD3 se ele teve culpa ou dolo."},"Direito Constitucional":{t:["Poder constituinte ORIGIN\xC1RIO: cria a Constitui\xE7\xE3o; \xE9 inicial, ilimitado e incondicionado. DERIVADO REFORMADOR: emendas (art. 60). DERIVADO DECORRENTE: Constitui\xE7\xF5es estaduais.","Normas de efic\xE1cia PLENA (aplica\xE7\xE3o imediata, n\xE3o precisam de lei), CONTIDA (aplica\xE7\xE3o imediata, mas a lei pode restringir) e LIMITADA (dependem de lei para produzir todos os efeitos).","Hierarquia: a Constitui\xE7\xE3o est\xE1 no topo. Emendas aprovadas t\xEAm status constitucional. Tratados de direitos humanos aprovados em 2 turnos por 3/5 em cada Casa equivalem a emendas.","Cl\xE1usulas p\xE9treas (art. 60, \xA74\xBA): forma federativa de Estado; voto direto, secreto, universal e peri\xF3dico; separa\xE7\xE3o dos Poderes; direitos e garantias individuais.","Rem\xE9dios constitucionais: habeas corpus (liberdade de locomo\xE7\xE3o), habeas data (informa\xE7\xF5es pessoais), mandado de seguran\xE7a (direito l\xEDquido e certo), mandado de injun\xE7\xE3o (falta de norma regulamentadora) e a\xE7\xE3o popular (qualquer cidad\xE3o, contra ato lesivo ao patrim\xF4nio p\xFAblico)."],cai:"Cl\xE1usulas p\xE9treas e qual rem\xE9dio constitucional usar em cada caso.",macete:"P\xE9treas = 'FO-DI-VO-SE': FOrma federativa, DIreitos individuais, VOto direto secreto universal peri\xF3dico, SEpara\xE7\xE3o dos Poderes."},"\xC9tica e atendimento":{t:["\xC9tica no servi\xE7o p\xFAblico: agir com integridade, transpar\xEAncia, impessoalidade e foco no interesse p\xFAblico.","Conflito de interesses: situa\xE7\xE3o em que o interesse privado do agente pode comprometer o interesse coletivo ou influenciar sua atua\xE7\xE3o.","Lei 13.460/2017: participa\xE7\xE3o, prote\xE7\xE3o e defesa dos direitos do usu\xE1rio dos servi\xE7os p\xFAblicos.","Carta de Servi\xE7os ao Usu\xE1rio (art. 7\xBA): informa os servi\xE7os prestados, como acess\xE1-los e os compromissos e padr\xF5es de qualidade.","Ouvidoria (art. 16): resposta conclusiva em at\xE9 30 dias, prorrog\xE1vel de forma justificada uma \xFAnica vez por igual per\xEDodo.","Bom atendimento: escuta ativa, linguagem clara, cortesia, informa\xE7\xE3o correta e encaminhamento certo. Nunca prometer o que n\xE3o depende de voc\xEA."],cai:"Prazo da ouvidoria (30 + 30) e o que \xE9 a Carta de Servi\xE7os.",macete:"Ouvidoria: '30 e mais 30, uma vez s\xF3'.",lei:X+"_ato2015-2018/2017/lei/l13460.htm"},Arquivologia:{t:["Teoria das tr\xEAs idades: arquivo CORRENTE (uso frequente, perto de quem produziu), INTERMEDI\xC1RIO (pouco uso, aguarda destina\xE7\xE3o) e PERMANENTE (valor hist\xF3rico, probat\xF3rio e informativo, guardado para sempre).","Lei 8.159/1991, art. 10: documentos de valor permanente s\xE3o inalien\xE1veis e imprescrit\xEDveis.","Gest\xE3o de documentos (art. 3\xBA): procedimentos de produ\xE7\xE3o, tramita\xE7\xE3o, uso, avalia\xE7\xE3o e arquivamento nas fases corrente e intermedi\xE1ria, visando a elimina\xE7\xE3o ou o recolhimento para guarda permanente.","Tabela de temporalidade: define por quanto tempo cada documento fica em cada fase e sua destina\xE7\xE3o final (elimina\xE7\xE3o ou guarda permanente).","Princ\xEDpio da proveni\xEAncia (respeito aos fundos): n\xE3o misturar documentos de origens (produtores) diferentes.","M\xE9todos de arquivamento: alfab\xE9tico, num\xE9rico, geogr\xE1fico e por assunto (ideogr\xE1fico)."],cai:"As tr\xEAs idades e o princ\xEDpio da proveni\xEAncia.",macete:"Corrente = Correndo (em uso). Intermedi\xE1rio = Intervalo (esperando). Permanente = Para sempre.",lei:X+"leis/l8159.htm"},"Reda\xE7\xE3o oficial":{t:["Atributos (Manual de Reda\xE7\xE3o da Presid\xEAncia, 3\xAA ed.): clareza e precis\xE3o, objetividade, concis\xE3o, coes\xE3o e coer\xEAncia, impessoalidade, formalidade e padroniza\xE7\xE3o, uso da norma padr\xE3o.","Padr\xE3o of\xEDcio: a 3\xAA edi\xE7\xE3o unificou of\xEDcio, aviso e memorando em um s\xF3 formato, o of\xEDcio.","Pronomes de tratamento levam o verbo para a 3\xAA pessoa: 'Vossa Excel\xEAncia SABE', 'Vossa Senhoria ENVIOU seu relat\xF3rio'.","Vossa Excel\xEAncia: chefes de Poder, ministros, governadores, prefeitos, parlamentares, magistrados. Vossa Senhoria: demais autoridades e particulares.","Fechos: 'Respeitosamente' para autoridade de hierarquia superior; 'Atenciosamente' para mesma hierarquia ou inferior.","'Dign\xEDssimo' e 'Ilustr\xEDssimo' foram abolidos nas comunica\xE7\xF5es oficiais."],cai:"Pronome de tratamento com verbo na 3\xAA pessoa e fechos.",macete:"Vossa Excel\xEAncia \xE9 com quem voc\xEA FALA, Sua Excel\xEAncia \xE9 DE quem voc\xEA fala."},"M\xE9todos de pesquisa":{t:["Quanto aos objetivos: EXPLORAT\xD3RIA (conhecer um tema pouco estudado), DESCRITIVA (descrever caracter\xEDsticas de uma popula\xE7\xE3o ou fen\xF4meno) e EXPLICATIVA (identificar causas).","Quanto \xE0 abordagem: QUALITATIVA (interpreta significados, opini\xF5es) e QUANTITATIVA (mede, usa n\xFAmeros e estat\xEDstica).","Procedimentos: bibliogr\xE1fica (livros, artigos), documental (documentos sem tratamento anal\xEDtico), experimental, levantamento (survey), estudo de caso, pesquisa-a\xE7\xE3o e pesquisa participante.","Instrumentos: question\xE1rio (respondido sem a presen\xE7a do pesquisador), formul\xE1rio (preenchido pelo pesquisador), entrevista e observa\xE7\xE3o.","Amostra probabil\xEDstica (todos t\xEAm chance conhecida de serem escolhidos, como sorteio) x n\xE3o probabil\xEDstica (por conveni\xEAncia, por cotas).","Aten\xE7\xE3o: o edital lista este tema sem detalhar subt\xF3picos no trecho que temos. Confira a p\xE1gina 45 do Edital 4/2026."],cai:"Diferen\xE7a entre explorat\xF3ria, descritiva e explicativa e entre bibliogr\xE1fica e documental.",macete:"Explora \u2192 conhece. Descreve \u2192 mostra como \xE9. Explica \u2192 diz o porqu\xEA."},"Or\xE7amento p\xFAblico":{t:["Tr\xEAs leis or\xE7ament\xE1rias (CF, art. 165), todas de iniciativa do Executivo: PPA (plano plurianual, 4 anos), LDO (diretrizes, metas e prioridades para o ano seguinte) e LOA (or\xE7amento anual: receitas e despesas).","Princ\xEDpio da EXCLUSIVIDADE: a LOA n\xE3o pode ter dispositivo estranho \xE0 previs\xE3o da receita e \xE0 fixa\xE7\xE3o da despesa (exceto cr\xE9ditos suplementares e opera\xE7\xF5es de cr\xE9dito).","Princ\xEDpio da ANUALIDADE: o or\xE7amento vale para um exerc\xEDcio (ano civil). UNIVERSALIDADE: todas as receitas e despesas entram na LOA. UNIDADE: uma s\xF3 lei or\xE7ament\xE1ria por ente.","Ciclo: elabora\xE7\xE3o, discuss\xE3o e aprova\xE7\xE3o, execu\xE7\xE3o e controle/avalia\xE7\xE3o."],cai:"PPA, LDO e LOA: o que cada uma faz e o prazo do PPA.",macete:"PPA planeja 4 anos, LDO d\xE1 a Dire\xE7\xE3o, LOA \xE9 o Or\xE7amento Anual."},"Gest\xE3o de pessoas":{t:["Pir\xE2mide de Maslow (da base ao topo): fisiol\xF3gicas, seguran\xE7a, sociais, estima e autorrealiza\xE7\xE3o.","Herzberg: fatores HIGI\xCANICOS (sal\xE1rio, condi\xE7\xF5es de trabalho, chefia) evitam insatisfa\xE7\xE3o; fatores MOTIVACIONAIS (reconhecimento, responsabilidade, crescimento) geram satisfa\xE7\xE3o.","Lideran\xE7a autocr\xE1tica (o l\xEDder decide sozinho), democr\xE1tica (decide com o grupo) e liberal ou laissez-faire (o grupo decide, o l\xEDder quase n\xE3o participa).","Processos de gest\xE3o de pessoas: agregar (recrutar e selecionar), aplicar, recompensar, desenvolver (treinar), manter e monitorar.","No servi\xE7o p\xFAblico, o ingresso em cargo efetivo depende de concurso (CF, art. 37, II)."],cai:"Ordem da pir\xE2mide de Maslow e a diferen\xE7a entre fatores higi\xEAnicos e motivacionais.",macete:"Sal\xE1rio \xE9 HIGI\xCANICO em Herzberg: tira a insatisfa\xE7\xE3o, mas n\xE3o motiva sozinho."},"Uso dos porqu\xEAs":{t:["POR QUE (separado, sem acento): pergunta no in\xEDcio ou no meio ('Por que voc\xEA faltou?') ou quando d\xE1 para trocar por 'pelo qual / pela qual' ('O caminho por que passei').","POR QU\xCA (separado, com acento): no fim da frase, antes do ponto ('Voc\xEA faltou por qu\xEA?').","PORQUE (junto, sem acento): resposta ou explica\xE7\xE3o, equivale a 'pois' ('Faltei porque estava doente').","PORQU\xCA (junto, com acento): \xE9 substantivo, vem com artigo ('N\xE3o sei o porqu\xEA da falta')."],cai:"Porqu\xEA com artigo e por qu\xEA em final de frase.",macete:"Tem artigo antes ('o porqu\xEA')? Junto com acento. Est\xE1 colado no ponto? Separado com acento."},Crase:{t:["Crase = preposi\xE7\xE3o 'a' + artigo 'a'. S\xF3 acontece antes de palavra FEMININA quando o verbo ou nome pede a preposi\xE7\xE3o 'a'.","Teste da troca: troque a palavra feminina por uma masculina. Se virar 'ao', tem crase ('Fui \xE0 escola' \u2192 'Fui ao col\xE9gio').","Lugar: 'Vou a Curitiba, volto DE Curitiba' (sem crase). 'Vou \xE0 Bahia, volto DA Bahia' (com crase).","NUNCA antes de verbo, de palavra masculina, de pronomes pessoais (ela, Vossa Excel\xEAncia) e de 'a' no singular seguido de palavra no plural ('a pessoas').","Horas: '\xE0s 14 horas'. Locu\xE7\xF5es femininas: \xE0s vezes, \xE0 noite, \xE0 medida que, \xE0s pressas.","Facultativa: antes de pronome possessivo feminino ('a/\xE0 sua m\xE3e') e de nome pr\xF3prio feminino de pessoa ('a/\xE0 Maria'), e depois de 'at\xE9'."],cai:"Crase antes de verbo e de pronome de tratamento (sempre errado) e o 'vou a, volto da'.",macete:"'Vou A volto DA, crase H\xC1. Vou A volto DE, crase pra qu\xEA?'"},Concord\u00E2ncia:{t:["HAVER no sentido de existir \xE9 impessoal: fica no singular ('Havia muitas pessoas').","FAZER indicando tempo \xE9 impessoal: 'Faz dois anos que moro aqui'.","Voz passiva sint\xE9tica: o verbo concorda com o sujeito ('Vendem-se casas', 'Alugam-se salas').","Com preposi\xE7\xE3o, o sujeito \xE9 indeterminado e o verbo fica no singular ('Precisa-se de funcion\xE1rios').","'\xC9 proibido entrada' (sem artigo, fica no masculino) x '\xC9 proibida A entrada' (com artigo, concorda).","Anexo, incluso, obrigado, mesmo concordam com o nome ('Seguem anexas as c\xF3pias'). 'Em anexo' n\xE3o varia.","'Meio' adv\xE9rbio n\xE3o varia ('ela est\xE1 meio cansada'); numeral concorda ('meio-dia e meia').","'Bastante' adjetivo (= muitos) varia: 'bastantes alunos'."],cai:"Haver impessoal, voz passiva com 'se' e anexo/meio.",macete:"Troque HAVER por EXISTIR: se couber 'existiam', o certo \xE9 'havia' (singular)."},Acentua\u00E7\u00E3o:{t:["Proparox\xEDtonas: TODAS acentuadas (l\xE2mpada, m\xE9dico, \xF4nibus).","Ox\xEDtonas: terminadas em a(s), e(s), o(s), em, ens (sof\xE1, voc\xEA, av\xF4, tamb\xE9m, parab\xE9ns).","Parox\xEDtonas: terminadas em l, n, r, x, ps, \xE3(s), \xE3o(s), i(s), us, um, uns e ditongo (f\xE1cil, h\xEDfen, car\xE1ter, t\xF3rax, b\xEDceps, \xF3rf\xE3, \xF3rg\xE3o, t\xE1xi, l\xE1pis, v\xEDrus, \xE1lbum, hist\xF3ria).","Acordo de 1990: perderam o acento os ditongos abertos 'ei' e 'oi' das parox\xEDtonas (ideia, assembleia, heroico, jiboia), o 'oo' e o 'ee' (voo, enjoo, leem, creem, deem, veem) e o acento diferencial de 'para' (verbo).","Continuam com acento: p\xF4de (passado) x pode (presente), p\xF4r (verbo) x por (preposi\xE7\xE3o), t\xEAm/v\xEAm (plural).","Ox\xEDtonas com ditongo aberto continuam acentuadas: pap\xE9is, her\xF3i, chap\xE9u."],cai:"Palavras que perderam acento no Acordo (ideia, heroico, voo) e as que mant\xEAm (her\xF3i, pap\xE9is).",macete:"Ditongo aberto s\xF3 mant\xE9m o acento no FIM da palavra: heR\xD3I tem, heROIco n\xE3o."},Pontua\u00E7\u00E3o:{t:["N\xC3O se separa sujeito do verbo, nem verbo do complemento, com v\xEDrgula.","V\xEDrgula obrigat\xF3ria no vocativo ('Jo\xE3o, venha c\xE1'), no aposto explicativo ('Curitiba, capital do Paran\xE1, \xE9 fria') e para isolar express\xF5es explicativas (isto \xE9, ou seja, por exemplo).","Adjunto adverbial deslocado: v\xEDrgula facultativa se curto, recomendada se longo.","Ora\xE7\xE3o adjetiva explicativa vai entre v\xEDrgulas; restritiva n\xE3o leva v\xEDrgula. Mudar isso muda o sentido.","Antes de 'mas', 'por\xE9m', 'contudo': v\xEDrgula. 'Por\xE9m/contudo' podem vir deslocados, entre v\xEDrgulas.","Ponto e v\xEDrgula: separa itens de enumera\xE7\xE3o longa e ora\xE7\xF5es coordenadas que j\xE1 t\xEAm v\xEDrgula."],cai:"V\xEDrgula entre sujeito e verbo (erro cl\xE1ssico) e explicativa x restritiva.",macete:"Se a v\xEDrgula fica entre QUEM faz e O QUE faz, est\xE1 errada."},"Conectivos e coes\xE3o":{t:["Adversativos (oposi\xE7\xE3o): mas, por\xE9m, contudo, todavia, entretanto, no entanto.","Conclusivos: logo, portanto, por isso, assim, pois (depois do verbo).","Explicativos/causais: porque, pois (antes do verbo), visto que, j\xE1 que, uma vez que.","Concessivos (oposi\xE7\xE3o que n\xE3o impede): embora, ainda que, mesmo que, apesar de que. Pedem subjuntivo: 'Embora CHOVESSE, sa\xED'.","Condicionais: se, caso, desde que, contanto que.","Coes\xE3o por retomada: pronomes, sin\xF4nimos e elipse evitam repetir palavras."],cai:"Trocar um conectivo por outro sem mudar o sentido (ex.: 'por\xE9m' por 'contudo').",macete:"Embora = 'mesmo assim aconteceu'. Mas = 'aconteceu o contr\xE1rio do esperado'."},"Sem\xE2ntica e figuras":{t:["Denota\xE7\xE3o: sentido literal, de dicion\xE1rio. Conota\xE7\xE3o: sentido figurado.","Met\xE1fora: compara\xE7\xE3o sem 'como' ('Ela \xE9 uma flor'). Compara\xE7\xE3o: com 'como' ('Forte como um touro').","Meton\xEDmia: troca por rela\xE7\xE3o de proximidade ('Li Machado de Assis' = a obra dele; 'Bebeu um copo' = o conte\xFAdo).","Hip\xE9rbole: exagero ('J\xE1 falei mil vezes'). Eufemismo: suaviza ('Ele partiu desta para melhor').","Ironia: diz o contr\xE1rio do que pensa. Ant\xEDtese: ideias opostas ('Riso e choro'). Paradoxo: ideias opostas que se juntam numa afirma\xE7\xE3o aparentemente absurda ('Estou cego de tanto ver').","Prosopopeia (personifica\xE7\xE3o): dar a\xE7\xE3o humana a coisas ('O vento sussurrava').","Sin\xF4nimos (mesmo sentido), ant\xF4nimos (sentido oposto), hom\xF4nimos (mesma pron\xFAncia ou grafia, sentidos diferentes: cela/sela), par\xF4nimos (parecidos: comprimento/cumprimento)."],cai:"Met\xE1fora x meton\xEDmia e ant\xEDtese x paradoxo.",macete:"Ant\xEDtese s\xF3 COLOCA os opostos lado a lado. Paradoxo os FUNDE numa ideia s\xF3."},"Fun\xE7\xF5es da linguagem":{t:["Referencial: foco na informa\xE7\xE3o (not\xEDcia, texto cient\xEDfico).","Emotiva: foco no emissor, 1\xAA pessoa, sentimentos (di\xE1rio, desabafo).","Conativa ou apelativa: foco no receptor, quer convencer, usa imperativo e 'voc\xEA' (propaganda).","F\xE1tica: testa o canal de comunica\xE7\xE3o ('Al\xF4?', 'T\xE1 me ouvindo?').","Metalingu\xEDstica: a linguagem fala de si mesma (dicion\xE1rio, poema sobre fazer poema).","Po\xE9tica: foco na forma da mensagem (rima, ritmo, jogo de palavras).","Varia\xE7\xE3o lingu\xEDstica: regional, social, hist\xF3rica e situacional. N\xE3o existe 'erro' na fala, existe adequa\xE7\xE3o \xE0 situa\xE7\xE3o."],cai:"Propaganda = conativa; dicion\xE1rio = metalingu\xEDstica.",macete:"CONativa CONvence. F\xC1TICA Faz o Teste do canal."},"Literatura brasileira":{t:["Quinhentismo: Carta de Pero Vaz de Caminha e textos de catequese (Anchieta).","Barroco: Greg\xF3rio de Matos ('Boca do Inferno') e Padre Ant\xF4nio Vieira (serm\xF5es). Conflito, ant\xEDteses e paradoxos.","Arcadismo: Cl\xE1udio Manuel da Costa, Tom\xE1s Ant\xF4nio Gonzaga (Mar\xEDlia de Dirceu). Bucolismo, fugere urbem, carpe diem.","Romantismo: Gon\xE7alves Dias (Can\xE7\xE3o do Ex\xEDlio, indianismo), \xC1lvares de Azevedo (ultrarromantismo), Castro Alves (poeta dos escravos, O Navio Negreiro), Jos\xE9 de Alencar (Iracema, O Guarani, Senhora).","Realismo: Machado de Assis, Mem\xF3rias P\xF3stumas de Br\xE1s Cubas (1881) e Dom Casmurro. Naturalismo: Alu\xEDsio Azevedo (O Corti\xE7o).","Parnasianismo: Olavo Bilac, 'arte pela arte', forma perfeita. Simbolismo: Cruz e Sousa (Missal e Broqu\xE9is, 1893), musicalidade e espiritualidade.","Modernismo: Semana de Arte Moderna de 1922 (M\xE1rio e Oswald de Andrade, Manuel Bandeira); depois Drummond, Graciliano Ramos (Vidas Secas), Rachel de Queiroz, Clarice Lispector, Guimar\xE3es Rosa."],cai:"Autor x escola liter\xE1ria e caracter\xEDsticas de cada escola.",macete:"Castro Alves \xE9 o 'Condor' (condoreirismo, poesia social). \xC1lvares de Azevedo \xE9 o 'mal do s\xE9culo'."},"Atalhos do Windows":{t:["Win + D: mostra a \xE1rea de trabalho. Win + L: bloqueia o computador. Win + E: abre o Explorador de Arquivos.","Alt + Tab: alterna janelas. Alt + F4: fecha a janela ativa.","Ctrl + Shift + Esc: Gerenciador de Tarefas. Win + V: hist\xF3rico da \xE1rea de transfer\xEAncia. Win + Shift + S: captura de parte da tela.","F2: renomear. Delete: manda para a Lixeira. Shift + Delete: exclui direto, sem passar pela Lixeira.","Ctrl + C copiar, Ctrl + X recortar, Ctrl + V colar, Ctrl + Z desfazer, Ctrl + Y refazer, Ctrl + A selecionar tudo (no Windows).","Arrastar arquivo para pasta na MESMA unidade = mover. Para OUTRA unidade = copiar."],cai:"Shift + Delete, Win + L, Win + D e arrastar entre unidades.",macete:"Win + L = Lock (trancar). Win + D = Desktop. Win + E = Explorer."},"Word 2016":{t:["Atalhos do Word em portugu\xEAs: Ctrl + N negrito, Ctrl + I it\xE1lico, Ctrl + S sublinhado.","Ctrl + B salvar, Ctrl + O novo documento, Ctrl + A abrir, Ctrl + P imprimir, Ctrl + T selecionar tudo.","Alinhamento: Ctrl + E centralizar, Ctrl + J justificar, Ctrl + Q \xE0 esquerda, Ctrl + G \xE0 direita.","Ctrl + L localizar, Ctrl + U substituir, Ctrl + Enter quebra de p\xE1gina.","Guias (abas): P\xE1gina Inicial (fonte e par\xE1grafo), Inserir (tabela, imagem, cabe\xE7alho), Layout (margens, orienta\xE7\xE3o), Refer\xEAncias (sum\xE1rio, notas de rodap\xE9), Revis\xE3o (ortografia, controlar altera\xE7\xF5es), Exibir."],cai:"Atalhos em portugu\xEAs (que s\xE3o diferentes do ingl\xEAs): Ctrl + N, Ctrl + S, Ctrl + B.",macete:"No Word em PT: N de Negrito, I de It\xE1lico, S de Sublinhado. B de 'Bora salvar'."},"Excel 2016":{t:[`Toda f\xF3rmula come\xE7a com = (ou + / -). Intervalo usa ':' (A1:A5) e argumentos usam ';' (=SE(A1>7;"Aprovado";"Reprovado")).`,"Fun\xE7\xF5es: SOMA, M\xC9DIA, M\xC1XIMO, M\xCDNIMO, CONT.N\xDAM (conta n\xFAmeros), CONT.VALORES (conta n\xE3o vazias), CONT.SE, SOMASE, SE, PROCV, HOJE, AGORA.","Refer\xEAncia relativa (A1) muda ao copiar; absoluta ($A$1) n\xE3o muda; mista ($A1 ou A$1) trava s\xF3 coluna ou s\xF3 linha. F4 alterna entre elas.","Copiar =A1*$B$1 de C1 para C2 vira =A2*$B$1.",'& junta textos (=A1&" "&B1). Ctrl + ; insere a data atual.',"PROCV(valor procurado; tabela; n\xBA da coluna; 0 ou FALSO para correspond\xEAncia exata)."],cai:"Copiar f\xF3rmula com $ e calcular o resultado de SOMA/M\xC9DIA/SE em uma tabela.",macete:"O $ 'congela' o que vem logo depois dele."},"Linux Ubuntu":{t:["ls: lista arquivos. cd: muda de pasta. pwd: mostra a pasta atual. mkdir: cria pasta. rm: remove. cp: copia. mv: move ou renomeia.","sudo: executa comando como administrador (root). chmod: muda permiss\xF5es.","Linux \xE9 software livre; o Ubuntu \xE9 uma distribui\xE7\xE3o. A interface padr\xE3o do Ubuntu \xE9 o GNOME.","No Linux, letras mai\xFAsculas e min\xFAsculas s\xE3o diferentes em nomes de arquivos (Arquivo.txt \u2260 arquivo.txt).","Pasta pessoal do usu\xE1rio: /home/usuario (atalho ~)."],cai:"Para que serve cada comando b\xE1sico e o 'sudo'.",macete:"mv serve para MOVER e para RENOMEAR. N\xE3o existe comando 'rename' b\xE1sico na prova."},"Seguran\xE7a da informa\xE7\xE3o":{t:["Pilares: Confidencialidade (s\xF3 quem pode v\xEA), Integridade (n\xE3o foi alterado) e Disponibilidade (est\xE1 acess\xEDvel quando precisa). Tamb\xE9m: autenticidade.","Phishing: mensagem falsa que imita banco, \xF3rg\xE3o ou empresa para roubar dados.","Ransomware: criptografa os arquivos e pede resgate. Melhor defesa: backup atualizado e separado.","V\xEDrus precisa de um hospedeiro e da execu\xE7\xE3o; worm se espalha sozinho pela rede; cavalo de Troia se disfar\xE7a de programa \xFAtil; spyware espiona; keylogger captura o que \xE9 digitado.","Firewall filtra conex\xF5es de rede. Antiv\xEDrus detecta malware. Autentica\xE7\xE3o em dois fatores: senha + outro fator (c\xF3digo no celular).","Backup completo (tudo), incremental (s\xF3 o que mudou desde o \xFAltimo backup de qualquer tipo) e diferencial (o que mudou desde o \xFAltimo completo)."],cai:"Diferen\xE7a entre v\xEDrus, worm e cavalo de Troia, e o que \xE9 phishing/ransomware.",macete:"Worm = minhoca: anda SOZINHA. V\xEDrus precisa que algu\xE9m o execute."},"Internet, e-mail e nuvem":{t:["E-mail: Para (destinat\xE1rio), CC (c\xF3pia vis\xEDvel a todos), CCO (c\xF3pia oculta: ningu\xE9m v\xEA quem est\xE1 em CCO).","Responder responde s\xF3 ao remetente; Responder a todos inclui quem estava em Para e CC (n\xE3o quem estava em CCO).","Gmail, Outlook e Zimbra (webmail de c\xF3digo aberto, usado por muitos \xF3rg\xE3os p\xFAblicos) funcionam no navegador.","Google Drive: armazenamento em nuvem; a cota gratuita \xE9 dividida entre Drive, Gmail e Google Fotos. D\xE1 para compartilhar com permiss\xE3o de leitor, comentarista ou editor.","Busca: aspas = frase exata; sinal de menos = exclui termo; site: = s\xF3 naquele site; filetype: = tipo de arquivo.","Navegador: Ctrl + T nova aba, Ctrl + Shift + T reabre a \xFAltima aba fechada, Ctrl + H hist\xF3rico, Ctrl + D favoritos. Janela an\xF4nima: Ctrl + Shift + N (Chrome e Edge) e Ctrl + Shift + P (Firefox)."],cai:"CC x CCO e os operadores de busca.",macete:"CCO = C\xF3pia Carbono Oculta: o O \xE9 de Oculta."},"Hardware e software":{t:["Hardware = parte f\xEDsica. Software = programas. Sistema operacional (Windows, Linux) gerencia o hardware.","Entrada: teclado, mouse, scanner, microfone, webcam. Sa\xEDda: monitor, impressora, caixa de som. Entrada e sa\xEDda: tela touchscreen, impressora multifuncional.","Mem\xF3ria RAM: principal, vol\xE1til (apaga ao desligar). ROM: n\xE3o vol\xE1til, guarda o firmware. HD e SSD: armazenamento secund\xE1rio (o SSD n\xE3o tem partes m\xF3veis e \xE9 mais r\xE1pido).","CPU (processador): executa as instru\xE7\xF5es. Pen drive e HD externo: armazenamento remov\xEDvel.","Software livre: pode usar, estudar, modificar e distribuir. Freeware: gratuito, mas c\xF3digo fechado."],cai:"RAM vol\xE1til x ROM e perif\xE9ricos de entrada/sa\xEDda.",macete:"RAM = R\xE1pida e Apaga ao desligar."},"IA generativa":{t:["IA generativa cria conte\xFAdo novo (texto, imagem, c\xF3digo) a partir de um pedido (prompt). Exemplos: ChatGPT (OpenAI), Copilot (Microsoft), Gemini (Google).","Pode 'alucinar': gerar informa\xE7\xE3o falsa com apar\xEAncia de verdadeira. Sempre conferir em fonte oficial.","Cuidado com dados pessoais e sigilosos: n\xE3o colar informa\xE7\xF5es protegidas (LGPD) em ferramentas p\xFAblicas.","Bom prompt: contexto, tarefa clara, formato da resposta e exemplos."],cai:"O que \xE9 alucina\xE7\xE3o e cuidados com dados.",macete:"IA escreve bem at\xE9 quando est\xE1 errada. Confira sempre."},"CF: princ\xEDpios fundamentais (arts. 1\xBA a 4\xBA)":{t:["Art. 1\xBA: a Rep\xFAblica Federativa do Brasil \xE9 formada pela uni\xE3o indissol\xFAvel dos Estados, Munic\xEDpios e DF, e \xE9 um Estado Democr\xE1tico de Direito.","Fundamentos (art. 1\xBA): soberania, cidadania, dignidade da pessoa humana, valores sociais do trabalho e da livre iniciativa e pluralismo pol\xEDtico.","Art. 2\xBA: Poderes independentes e harm\xF4nicos entre si: Legislativo, Executivo e Judici\xE1rio.","Objetivos (art. 3\xBA): construir sociedade livre, justa e solid\xE1ria; garantir o desenvolvimento nacional; erradicar a pobreza e a marginaliza\xE7\xE3o e reduzir as desigualdades sociais e regionais; promover o bem de todos, sem preconceitos.","Rela\xE7\xF5es internacionais (art. 4\xBA): independ\xEAncia nacional, preval\xEAncia dos direitos humanos, autodetermina\xE7\xE3o dos povos, n\xE3o interven\xE7\xE3o, igualdade entre os Estados, defesa da paz, solu\xE7\xE3o pac\xEDfica dos conflitos, rep\xFAdio ao terrorismo e ao racismo, coopera\xE7\xE3o entre os povos e concess\xE3o de asilo pol\xEDtico."],cai:"Trocar um fundamento por um objetivo (pegadinha cl\xE1ssica).",macete:"Fundamentos = SO-CI-DI-VA-PLU. Objetivos come\xE7am com VERBO (construir, garantir, erradicar, promover).",lei:X+"constituicao/constituicao.htm"},"CF: direitos e garantias (arts. 5\xBA a 17)":{t:["Art. 5\xBA, XI: a casa \xE9 asilo inviol\xE1vel; s\xF3 se entra sem consentimento em flagrante delito, desastre, para prestar socorro ou, durante o DIA, por determina\xE7\xE3o judicial.","Rem\xE9dios: habeas corpus (locomo\xE7\xE3o), habeas data (dados pessoais), mandado de seguran\xE7a (direito l\xEDquido e certo), mandado de injun\xE7\xE3o (falta de norma), a\xE7\xE3o popular (qualquer cidad\xE3o). HC e HD s\xE3o gratuitos.","Art. 6\xBA, direitos sociais: educa\xE7\xE3o, sa\xFAde, alimenta\xE7\xE3o, trabalho, moradia, transporte, lazer, seguran\xE7a, previd\xEAncia social, prote\xE7\xE3o \xE0 maternidade e \xE0 inf\xE2ncia e assist\xEAncia aos desamparados.","Art. 7\xBA: jornada de at\xE9 8h di\xE1rias e 44h semanais; f\xE9rias com pelo menos 1/3 a mais.","Art. 12: cargos privativos de brasileiro NATO: Presidente e Vice, Presidente da C\xE2mara, Presidente do Senado, Ministro do STF, carreira diplom\xE1tica, oficial das For\xE7as Armadas e Ministro de Estado da Defesa.","Art. 14: voto obrigat\xF3rio para maiores de 18; facultativo para analfabetos, maiores de 70 e entre 16 e 18 anos. Idades m\xEDnimas: 35 (Presidente, Vice, Senador), 30 (Governador), 21 (Deputado, Prefeito, Vice-Prefeito, juiz de paz), 18 (Vereador).","Art. 13: l\xEDngua portuguesa \xE9 o idioma oficial. S\xEDmbolos: bandeira, hino, armas e selo nacionais."],cai:"Idades m\xEDnimas para cargos, voto facultativo e inviolabilidade da casa (dia x noite).",macete:"Idades: 35-30-21-18. Presidente e Senador 35; Governador 30; Deputado e Prefeito 21; Vereador 18.",lei:X+"constituicao/constituicao.htm"},"CF: organiza\xE7\xE3o do Estado (arts. 18, 19, 29, 30)":{t:["Art. 18: a organiza\xE7\xE3o pol\xEDtico-administrativa compreende Uni\xE3o, Estados, DF e Munic\xEDpios, todos AUT\xD4NOMOS. Bras\xEDlia \xE9 a Capital Federal.","Art. 19: \xE9 vedado aos entes estabelecer cultos religiosos ou igrejas, recusar f\xE9 aos documentos p\xFAblicos e criar distin\xE7\xF5es entre brasileiros ou prefer\xEAncias entre si.","Art. 29: o Munic\xEDpio \xE9 regido por Lei Org\xE2nica, votada em DOIS turnos, com interst\xEDcio m\xEDnimo de 10 dias, e aprovada por 2/3 dos membros da C\xE2mara Municipal.","Mandato de Prefeito, Vice e Vereadores: 4 anos. Segundo turno s\xF3 em Munic\xEDpios com mais de 200 mil eleitores.","Art. 30: compete aos Munic\xEDpios legislar sobre assuntos de interesse local, suplementar a legisla\xE7\xE3o federal e estadual no que couber, instituir e arrecadar seus tributos, criar distritos e organizar os servi\xE7os p\xFAblicos de interesse local, inclu\xEDdo o transporte coletivo (car\xE1ter essencial)."],cai:"Qu\xF3rum da Lei Org\xE2nica (2 turnos, 10 dias, 2/3) e compet\xEAncias do Munic\xEDpio.",macete:"Lei Org\xE2nica: '2 - 10 - 2/3'.",lei:X+"constituicao/constituicao.htm"},"CF: Administra\xE7\xE3o P\xFAblica (arts. 37 a 41)":{t:["Art. 37, caput: princ\xEDpios LIMPE.","Concurso p\xFAblico de provas ou de provas e t\xEDtulos para cargo efetivo e emprego p\xFAblico; exce\xE7\xE3o: cargo em comiss\xE3o declarado em lei de livre nomea\xE7\xE3o e exonera\xE7\xE3o.","Validade do concurso: AT\xC9 2 anos, prorrog\xE1vel UMA vez por IGUAL per\xEDodo.","Fun\xE7\xF5es de confian\xE7a: s\xF3 para quem j\xE1 ocupa cargo efetivo. Cargos em comiss\xE3o: dire\xE7\xE3o, chefia e assessoramento.","Acumula\xE7\xE3o remunerada \xE9 proibida, exceto, com compatibilidade de hor\xE1rios: 2 de professor; 1 de professor + 1 de qualquer natureza (EC 138/2025); 2 de profissional de sa\xFAde com profiss\xE3o regulamentada.","\xA71\xBA: publicidade oficial s\xF3 educativa, informativa ou de orienta\xE7\xE3o social, sem nomes, s\xEDmbolos ou imagens de promo\xE7\xE3o pessoal.","\xA74\xBA: improbidade gera suspens\xE3o dos direitos pol\xEDticos, perda da fun\xE7\xE3o p\xFAblica, indisponibilidade dos bens e ressarcimento ao er\xE1rio.","\xA76\xBA: responsabilidade objetiva do Estado e das prestadoras de servi\xE7o p\xFAblico, com direito de regresso contra o agente com dolo ou culpa.","Art. 41: estabilidade ap\xF3s 3 anos de efetivo exerc\xEDcio + avalia\xE7\xE3o especial de desempenho. Perde o cargo por senten\xE7a judicial transitada em julgado, processo administrativo com ampla defesa ou avalia\xE7\xE3o peri\xF3dica de desempenho.","Art. 38: Vereador com compatibilidade de hor\xE1rios acumula cargo e mandato (recebe os dois). Prefeito se afasta e pode optar pela remunera\xE7\xE3o."],cai:"Prazo de validade do concurso, estabilidade em 3 anos e as hip\xF3teses de acumula\xE7\xE3o.",macete:"Concurso '2 + 2 uma vez'. Estabilidade '3 anos + avalia\xE7\xE3o'.",lei:X+"constituicao/constituicao.htm"},"CF: Poder Legislativo (arts. 44 a 75)":{t:["Art. 44: o Congresso Nacional = C\xE2mara dos Deputados + Senado Federal. Cada legislatura dura 4 anos.","Deputados: representantes do POVO, sistema proporcional. Senadores: representantes dos ESTADOS e do DF, sistema majorit\xE1rio, 3 por Estado, mandato de 8 anos, renova\xE7\xE3o de 4 em 4 anos (1/3 e 2/3 alternadamente).","Art. 58, \xA73\xBA: CPI criada a requerimento de 1/3 dos membros, para apurar fato determinado, por prazo certo; tem poderes de investiga\xE7\xE3o pr\xF3prios das autoridades judiciais.","Art. 60: emenda constitucional \xE9 proposta por 1/3 da C\xE2mara ou do Senado, pelo Presidente ou por mais da metade das Assembleias Legislativas; votada em 2 turnos em cada Casa e aprovada por 3/5.","Art. 62: medida provis\xF3ria vale 60 dias, prorrog\xE1veis uma vez por mais 60.","Art. 69: lei complementar exige maioria ABSOLUTA. Lei ordin\xE1ria: maioria simples.","Arts. 70 e 71: controle externo feito pelo Congresso com aux\xEDlio do Tribunal de Contas da Uni\xE3o."],cai:"Qu\xF3rum de emenda (3/5, 2 turnos), CPI (1/3) e mandato de senador (8 anos).",macete:"Emenda: '3/5 em 2 turnos, nas 2 Casas'.",lei:X+"constituicao/constituicao.htm"},"Improbidade (Lei 8.429)":{t:["Depois da Lei 14.230/2021, s\xF3 existe improbidade DOLOSA (com inten\xE7\xE3o). N\xE3o h\xE1 mais improbidade culposa.","Tr\xEAs tipos: art. 9\xBA enriquecimento il\xEDcito; art. 10 preju\xEDzo ao er\xE1rio; art. 11 viola\xE7\xE3o dos princ\xEDpios da Administra\xE7\xE3o (rol taxativo).","San\xE7\xF5es (art. 12): art. 9\xBA \u2192 suspens\xE3o dos direitos pol\xEDticos at\xE9 14 anos e proibi\xE7\xE3o de contratar at\xE9 14 anos; art. 10 \u2192 at\xE9 12 anos; art. 11 \u2192 multa de at\xE9 24 vezes a remunera\xE7\xE3o e proibi\xE7\xE3o de contratar at\xE9 4 anos (n\xE3o h\xE1 suspens\xE3o de direitos pol\xEDticos).","Prescri\xE7\xE3o (art. 23): 8 anos, contados da ocorr\xEAncia do fato ou, nas infra\xE7\xF5es permanentes, do dia em que cessou a perman\xEAncia.","Mero exerc\xEDcio da fun\xE7\xE3o ou diverg\xEAncia na interpreta\xE7\xE3o da lei, sem dolo, n\xE3o \xE9 improbidade."],cai:"Exig\xEAncia de dolo, prazos de suspens\xE3o (14/12) e prescri\xE7\xE3o de 8 anos.",macete:"Enriqueceu? 14. Deu preju\xEDzo? 12. Feriu princ\xEDpio? multa 24x e 4 anos sem contratar.",lei:X+"leis/l8429.htm"},"Acesso \xE0 informa\xE7\xE3o (LAI)":{t:["Lei 12.527/2011. Publicidade \xE9 a regra; sigilo \xE9 a exce\xE7\xE3o.","Transpar\xEAncia ATIVA: o \xF3rg\xE3o divulga sem ningu\xE9m pedir (site). PASSIVA: responde ao pedido do cidad\xE3o.","Pedido: qualquer interessado pode pedir; n\xE3o precisa dizer o motivo (art. 10, \xA73\xBA).","Prazo de resposta (art. 11): se n\xE3o puder dar na hora, at\xE9 20 dias, prorrog\xE1veis por mais 10, com justificativa.","Recurso (art. 15): 10 dias contados da ci\xEAncia da decis\xE3o.","Servi\xE7o de busca e fornecimento \xE9 gratuito; pode ser cobrado s\xF3 o custo de reprodu\xE7\xE3o (art. 12).","Sigilo (art. 24): ultrassecreta 25 anos, secreta 15 anos, reservada 5 anos.","Informa\xE7\xF5es pessoais (art. 31): acesso restrito por at\xE9 100 anos."],cai:"Prazo 20 + 10, recurso em 10 dias e os prazos 25/15/5.",macete:"Sigilo: 'U-S-R = 25-15-5'. Resposta: '20 + 10'.",lei:X+"_ato2011-2014/2011/lei/l12527.htm"},"Prioridade de atendimento (Lei 10.048)":{t:["T\xEAm atendimento priorit\xE1rio: pessoas com defici\xEAncia, idosos com 60 anos ou mais, gestantes, lactantes, pessoas com crian\xE7as de colo e obesos, entre outros grupos inclu\xEDdos por leis posteriores (como pessoas com transtorno do espectro autista, pessoas com mobilidade reduzida e doadores de sangue).","Reparti\xE7\xF5es p\xFAblicas e concession\xE1rias de servi\xE7o p\xFAblico devem dar atendimento priorit\xE1rio e imediato a essas pessoas.","Logradouros, sanit\xE1rios p\xFAblicos e ve\xEDculos de transporte coletivo devem ser adaptados para pessoas com defici\xEAncia.","Confira a reda\xE7\xE3o atual no site do Planalto: a lista foi ampliada por leis recentes."],cai:"Idade do idoso (60 anos) e quem entra na lista.",macete:"Idoso na prioridade: 60+. N\xE3o confunda com 80+, que \xE9 a 'prioridade especial' do Estatuto da Pessoa Idosa.",lei:X+"leis/l10048.htm"},ECA:{t:["Art. 2\xBA: crian\xE7a \xE9 a pessoa at\xE9 12 anos INCOMPLETOS; adolescente, entre 12 e 18 anos. Excepcionalmente, o ECA se aplica a pessoas entre 18 e 21 anos.","Art. 4\xBA: \xE9 dever da fam\xEDlia, da comunidade, da sociedade em geral e do poder p\xFAblico assegurar, com ABSOLUTA PRIORIDADE, os direitos da crian\xE7a e do adolescente.","A prioridade inclui: primazia de socorro, preced\xEAncia no atendimento em servi\xE7os p\xFAblicos, prefer\xEAncia nas pol\xEDticas sociais e destina\xE7\xE3o privilegiada de recursos.","Art. 5\xBA: nenhuma crian\xE7a ou adolescente ser\xE1 objeto de neglig\xEAncia, discrimina\xE7\xE3o, explora\xE7\xE3o, viol\xEAncia, crueldade e opress\xE3o.","Direitos fundamentais: vida e sa\xFAde; liberdade, respeito e dignidade; conviv\xEAncia familiar e comunit\xE1ria; educa\xE7\xE3o, cultura, esporte e lazer; profissionaliza\xE7\xE3o e prote\xE7\xE3o no trabalho."],cai:"Idades de crian\xE7a e adolescente e o rol da absoluta prioridade.",macete:"Crian\xE7a: at\xE9 11 anos e 364 dias. Fez 12, virou adolescente.",lei:X+"leis/l8069.htm"},"LINDB (arts. 20 a 30)":{t:["Art. 20: nas esferas administrativa, controladora e judicial, n\xE3o se decide com base em valores jur\xEDdicos abstratos sem considerar as CONSEQU\xCANCIAS PR\xC1TICAS da decis\xE3o.","Art. 22: na interpreta\xE7\xE3o de normas sobre gest\xE3o p\xFAblica, s\xE3o considerados os obst\xE1culos e as dificuldades reais do gestor.","Art. 23: decis\xE3o que traz interpreta\xE7\xE3o nova, impondo novo dever, deve prever regime de transi\xE7\xE3o quando indispens\xE1vel.","Art. 26: a autoridade pode celebrar compromisso com os interessados para eliminar irregularidade ou incerteza jur\xEDdica.","Art. 28: o agente p\xFAblico responde pessoalmente por suas decis\xF5es ou opini\xF5es t\xE9cnicas em caso de DOLO ou ERRO GROSSEIRO.","Art. 30: as autoridades devem aumentar a seguran\xE7a jur\xEDdica, inclusive por meio de regulamentos, s\xFAmulas administrativas e respostas a consultas."],cai:"Art. 28 (dolo ou erro grosseiro) e art. 20 (consequ\xEAncias pr\xE1ticas).",macete:"O gestor s\xF3 paga do pr\xF3prio bolso se agiu com DOLO ou ERRO GROSSEIRO, n\xE3o por qualquer erro.",lei:X+"decreto-lei/del4657compilado.htm"},"LGPD (Cap. IV)":{t:["O Cap\xEDtulo IV da LGPD (arts. 23 a 32) trata do tratamento de dados pessoais pelo PODER P\xDABLICO.","Art. 23: o tratamento deve atender \xE0 finalidade p\xFAblica, na persecu\xE7\xE3o do interesse p\xFAblico, para executar compet\xEAncias legais ou cumprir atribui\xE7\xF5es legais do servi\xE7o p\xFAblico.","O \xF3rg\xE3o deve informar as hip\xF3teses em que trata dados (com base legal, finalidade e procedimentos) e indicar um ENCARREGADO pelo tratamento.","Art. 25: os dados devem ser mantidos em formato interoper\xE1vel e estruturado, para uso compartilhado.","A ANPD (Autoridade Nacional de Prote\xE7\xE3o de Dados) pode solicitar informa\xE7\xF5es e sugerir medidas aos \xF3rg\xE3os p\xFAblicos."],cai:"Finalidade p\xFAblica e figura do encarregado.",macete:"Poder p\xFAblico trata dado para cumprir sua FUN\xC7\xC3O, n\xE3o por curiosidade nem para vender.",lei:X+"_ato2015-2018/2018/lei/l13709.htm"},"Leis de Curitiba":{t:["Lei Org\xE2nica (1990): Curitiba \xE9 pessoa jur\xEDdica de direito p\xFAblico interno com autonomia pol\xEDtica, administrativa e financeira. Poderes: Legislativo (C\xE2mara) e Executivo (Prefeito + Secret\xE1rios). Data magna: 29 de mar\xE7o.","Lei 16.466/2024 (processo administrativo, sancionada em 19/12/2024): meio eletr\xF4nico obrigat\xF3rio; ato sem prazo = 5 dias \xFAteis; decis\xE3o em 30 dias \xFAteis (m\xE1x. 6 meses); recurso \xFAnico em 15 dias \xFAteis; prazos suspensos de 20/12 a 20/01.","Lei 1.656/1958 (Estatuto): penas = advert\xEAncia, repreens\xE3o, suspens\xE3o (at\xE9 90 dias), multa, destitui\xE7\xE3o de fun\xE7\xE3o e demiss\xE3o. Sindic\xE2ncia em 15 dias; PAD em 60 + 30; defesa em 20 dias; faltas leves prescrevem em 4 anos.","Lei 7.671/1991 (organiza\xE7\xE3o do Executivo): administra\xE7\xE3o direta (\xF3rg\xE3os colegiados, assessoramento, Secretarias meio e fim) e indireta (autarquias, funda\xE7\xF5es, empresas p\xFAblicas, economia mista e funda\xE7\xF5es estatais).","Atualiza\xE7\xE3o 2026: a Lei 16.763/2026 alterou a 16.466 (nova al\xEDnea d no art. 14) e a 7.671 (PARS S.A. entre as economias mistas e nova atribui\xE7\xE3o no art. 15)."],cai:"Prazos da Lei 16.466/2024 e penas/PAD do Estatuto (Lei 1.656/1958). Na Lei Org\xE2nica, Poderes, compet\xEAncias e regras do Prefeito.",macete:"16.466: 5 / 3 / 30 / 15. Estatuto: suspens\xE3o 90, sindic\xE2ncia 15, PAD 60+30, prescri\xE7\xE3o 4.",lei:"https://legisladocexterno.curitiba.pr.gov.br/VisualizarHTML.aspx?id=437437"}},questoes:[["Administra\xE7\xE3o P\xFAblica",1,"Os princ\xEDpios da Administra\xE7\xE3o P\xFAblica expressos no caput do art. 37 da Constitui\xE7\xE3o Federal s\xE3o:",["Legalidade, impessoalidade, moralidade, publicidade e efici\xEAncia","Legalidade, imparcialidade, moralidade, probidade e efici\xEAncia","Legalidade, impessoalidade, motiva\xE7\xE3o, publicidade e economicidade","Supremacia do interesse p\xFAblico, legalidade, moralidade, publicidade e efici\xEAncia","Legalidade, impessoalidade, moralidade, proporcionalidade e efici\xEAncia"],0,"LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade e Efici\xEAncia. Os outros princ\xEDpios existem na doutrina ou em leis, mas n\xE3o est\xE3o no caput do art. 37.",!0],["Administra\xE7\xE3o P\xFAblica",2,"Quando o Munic\xEDpio cria uma autarquia e transfere a ela a execu\xE7\xE3o de um servi\xE7o, ocorre:",["Descentraliza\xE7\xE3o","Desconcentra\xE7\xE3o","Delega\xE7\xE3o de compet\xEAncia entre \xF3rg\xE3os","Avoca\xE7\xE3o","Concentra\xE7\xE3o"],0,"A autarquia \xE9 OUTRA pessoa jur\xEDdica. Passar tarefa para outra pessoa \xE9 descentraliza\xE7\xE3o. Desconcentra\xE7\xE3o acontece dentro da mesma pessoa (cria\xE7\xE3o de \xF3rg\xE3os).",!0],["Administra\xE7\xE3o P\xFAblica",2,"Integram a Administra\xE7\xE3o P\xFAblica indireta:",["Autarquias, funda\xE7\xF5es p\xFAblicas, empresas p\xFAblicas e sociedades de economia mista","Secretarias municipais, autarquias e funda\xE7\xF5es p\xFAblicas","Minist\xE9rios, autarquias e empresas p\xFAblicas","Organiza\xE7\xF5es sociais, autarquias e empresas p\xFAblicas","C\xE2mara Municipal, autarquias e sociedades de economia mista"],0,"Secretarias e minist\xE9rios s\xE3o \xF3rg\xE3os da Administra\xE7\xE3o DIRETA. Organiza\xE7\xF5es sociais s\xE3o entidades privadas do terceiro setor, fora da Administra\xE7\xE3o.",!0],["Administra\xE7\xE3o P\xFAblica",1,"A fun\xE7\xE3o administrativa que consiste em acompanhar resultados, compar\xE1-los com o planejado e corrigir desvios \xE9:",["Controle","Planejamento","Organiza\xE7\xE3o","Dire\xE7\xE3o","Coordena\xE7\xE3o"],0,"No PODC, o Controle mede o desempenho e corrige rumos. Planejamento define objetivos; organiza\xE7\xE3o distribui recursos e tarefas; dire\xE7\xE3o conduz pessoas.",!1],["Administra\xE7\xE3o P\xFAblica",2,"A fiscaliza\xE7\xE3o sanit\xE1ria que interdita um restaurante sem condi\xE7\xF5es de higiene \xE9 manifesta\xE7\xE3o do poder:",["De pol\xEDcia","Hier\xE1rquico","Disciplinar","Regulamentar","Normativo"],0,"Poder de pol\xEDcia limita a liberdade e a propriedade do particular em favor do interesse p\xFAblico. Disciplinar \xE9 para punir quem tem v\xEDnculo com a Administra\xE7\xE3o (servidores, contratados).",!0],["Administra\xE7\xE3o P\xFAblica",1,"No programa 5S, o senso que trata de separar o que \xE9 \xFAtil do que n\xE3o \xE9, descartando o desnecess\xE1rio, \xE9 o:",["Seiri (utiliza\xE7\xE3o)","Seiton (ordena\xE7\xE3o)","Seiso (limpeza)","Sei oralidade, motivo e efici\xEAncia","Compet\xEAncia, finalidade, imperatividade, motivo e tipicidade"],0,"COFIFOMOB. Presun\xE7\xE3o de legitimidade, imperatividade, autoexecutoriedade e tipicidade s\xE3o ATRIBUTOS, n\xE3o elementos.",!0],["Atos administrativos",3,"O atributo que permite \xE0 Administra\xE7\xE3o executar suas decis\xF5es sem precisar de autoriza\xE7\xE3o pr\xE9via do Judici\xE1rio \xE9 a:",["Autoexecutoriedade","Imperatividade","Tipicidade","Presun\xE7\xE3o de veracidade","Discricionariedade"],0,"Autoexecutoriedade = executar por meios pr\xF3prios (ex.: demolir obra que amea\xE7a desabar). Imperatividade \xE9 impor obriga\xE7\xF5es ao particular independentemente da concord\xE2ncia dele.",!1],["Bens e servi\xE7os p\xFAblicos",2,"Um terreno municipal vazio, sem nenhuma destina\xE7\xE3o p\xFAblica, \xE9 classificado como bem:",["Dominical","De uso comum do povo","De uso especial","Privado do Munic\xEDpio, sem regime p\xFAblico","Afetado"],0,"Bens dominicais s\xE3o o patrim\xF4nio dispon\xEDvel do ente, sem destina\xE7\xE3o p\xFAblica espec\xEDfica. Ruas e pra\xE7as s\xE3o de uso comum; pr\xE9dios de escolas e reparti\xE7\xF5es, de uso especial.",!0],["Bens e servi\xE7os p\xFAblicos",2,"\xC9 caracter\xEDstica dos bens p\xFAblicos:",["N\xE3o podem ser adquiridos por usucapi\xE3o","Podem ser penhorados para pagar d\xEDvidas do ente","Podem ser vendidos livremente, sem exig\xEAncias legais","Perdem a prote\xE7\xE3o ap\xF3s 15 anos sem uso","S\xF3 os de uso especial s\xE3o impenhor\xE1veis"],0,"Imprescritibilidade: bem p\xFAblico n\xE3o sofre usucapi\xE3o (CF, arts. 183, \xA73\xBA, e 191, par\xE1grafo \xFAnico). Tamb\xE9m s\xE3o impenhor\xE1veis.",!0],["Bens e servi\xE7os p\xFAblicos",1,"Uma escola municipal em funcionamento \xE9 exemplo de bem p\xFAblico de:",["Uso especial","Uso comum do povo","Uso dominical","Uso privado","Uso compartilhado"],0,"O pr\xE9dio \xE9 usado para prestar um servi\xE7o p\xFAblico espec\xEDfico: uso especial.",!1],["Bens e servi\
