de legitimidade, autoexecutoriedade, tipicidade, imperatividade.","Atos administrativos"],["Modalidades (14.133)","Preg\xE3o, concorr\xEAncia, concurso, leil\xE3o, di\xE1logo competitivo.","Licita\xE7\xF5es (Lei 14.133)"],["Dispensa x inexigibilidade","Dispensa: competi\xE7\xE3o poss\xEDvel, lei permite n\xE3o licitar. Inexigibilidade: competi\xE7\xE3o invi\xE1vel.","Licita\xE7\xF5es (Lei 14.133)"],["Bens dominicais","Patrim\xF4nio dispon\xEDvel, sem destina\xE7\xE3o p\xFAblica (terreno vazio).","Bens e servi\xE7os p\xFAblicos"],["Tr\xEAs idades dos arquivos","Corrente (uso frequente), intermedi\xE1rio (aguarda destina\xE7\xE3o), permanente (guarda definitiva).","Arquivologia"],["Fecho de of\xEDcio","Respeitosamente: superior. Atenciosamente: mesma hierarquia ou inferior.","Reda\xE7\xE3o oficial"],["PPA, LDO, LOA","PPA 4 anos; LDO metas e prioridades do ano seguinte; LOA or\xE7amento anual.","Or\xE7amento p\xFAblico"],["Word PT: Ctrl+N / Ctrl+S / Ctrl+B","Negrito / Sublinhado / Salvar.","Word 2016"],["Excel: $A$1","Refer\xEAncia absoluta: n\xE3o muda ao copiar. F4 alterna.","Excel 2016"],["Shift + Delete","Exclui sem passar pela Lixeira.","Atalhos do Windows"],["Win + L / Win + D / Win + E","Bloquear / \xC1rea de trabalho / Explorador.","Atalhos do Windows"],["CCO","C\xF3pia oculta: os outros destinat\xE1rios n\xE3o veem.","Internet, e-mail e nuvem"],["Worm x v\xEDrus","Worm se espalha sozinho; v\xEDrus precisa de hospedeiro e execu\xE7\xE3o.","Seguran\xE7a da informa\xE7\xE3o"],["Porqu\xEA / por qu\xEA","Com artigo = porqu\xEA. Fim de frase = por qu\xEA.","Uso dos porqu\xEAs"],["Crase com lugar","Vou A, volto DA: crase h\xE1. Vou A, volto DE: crase pra qu\xEA?","Crase"],["Haver = existir","Impessoal, sempre singular: 'Havia muitas pessoas'.","Concord\xE2ncia"],["Acordo: perderam acento","ideia, heroico, assembleia, jiboia, voo, enjoo, leem, deem, para (verbo).","Acentua\xE7\xE3o"],...io,...so]};var Ba={id:"npor",nome:"NPOR",sub:"Exame intelectual \xB7 TAF \xB7 entrevista",dataPadrao:"2027-01-30",dataNota:"Data estimada. Confirme no quartel do seu NPOR e ajuste em Ajustes.",codigo:"EB \xB7 NPOR 2027",cor:"npor",materias:[{id:"mat",nome:"Matem\xE1tica",peso:30,gerado:!0},{id:"port",nome:"Portugu\xEAs",peso:25,temas:["Sintaxe e reg\xEAncia","Crase e pontua\xE7\xE3o","Sem\xE2ntica e interpreta\xE7\xE3o","Literatura: Quinhentismo ao Arcadismo","Literatura: Romantismo ao Simbolismo"]},{id:"hist",nome:"Hist\xF3ria do Brasil",peso:20,temas:["Col\xF4nia","Independ\xEAncia e Imp\xE9rio","Rep\xFAblica Velha","Era Vargas e FEB","Brasil de 1946 aos dias de hoje","Ex\xE9rcito Brasileiro"]},{id:"geo",nome:"Geografia",peso:15,temas:["Cartografia","Clima e relevo do Brasil","Biomas e dom\xEDnios","Popula\xE7\xE3o e economia","Territ\xF3rio e regi\xF5es"]},{id:"red",nome:"Reda\xE7\xE3o e entrevista",peso:10,temas:["Reda\xE7\xE3o dissertativa","Entrevista"]}],resumos:{"Sintaxe e reg\xEAncia":{t:["Sujeito: de quem se fala. Predicado: o que se diz do sujeito. Sujeito oculto (desinencial): identificado pela termina\xE7\xE3o do verbo ('Estudamos' = n\xF3s).","Objeto direto: complemento sem preposi\xE7\xE3o obrigat\xF3ria ('Comprei o livro'). Objeto indireto: com preposi\xE7\xE3o ('Gosto DE caf\xE9').","Adjunto adverbial: indica circunst\xE2ncia (tempo, lugar, modo). Aposto: explica um termo. Vocativo: chama algu\xE9m.","Reg\xEAncia: assistir (ver) pede 'a' ('Assisti AO filme'); obedecer pede 'a'; preferir: 'prefiro isto A aquilo' (nunca 'do que'); chegar e ir pedem 'a' ('Cheguei A casa', 'Fui AO quartel').","Implicar (acarretar) \xE9 transitivo direto: 'A decis\xE3o implica mudan\xE7as' (sem 'em').","Visar (ter em vista) pede 'a': 'O treino visa \xC0 aprova\xE7\xE3o'."],cai:"Reg\xEAncia de assistir, preferir e chegar; identificar sujeito e objeto.",macete:"Quem prefere, prefere uma coisa A outra. 'Do que' com preferir est\xE1 sempre errado."},"Crase e pontua\xE7\xE3o":{t:["Crase = a + a. S\xF3 antes de palavra feminina quando h\xE1 preposi\xE7\xE3o 'a'. Teste: troque por masculino; se virar 'ao', h\xE1 crase.","Nunca antes de verbo, de palavra masculina e de pronome pessoal.","N\xE3o se separa sujeito e verbo por v\xEDrgula. Vocativo e aposto explicativo levam v\xEDrgula."],cai:"Crase antes de verbo (errado) e v\xEDrgula entre sujeito e verbo (errado).",macete:"Troque por masculino: 'Fui \xE0 formatura' \u2192 'Fui ao desfile'. Virou 'ao'? Tem crase."},"Sem\xE2ntica e interpreta\xE7\xE3o":{t:["Interpreta\xE7\xE3o \xE9 o que o texto DIZ, n\xE3o o que voc\xEA acha. Desconfie de alternativas com 'sempre', 'nunca', 'todos', 'apenas'.","Ideia central: est\xE1 em geral no 1\xBA par\xE1grafo e \xE9 retomada na conclus\xE3o.","Infer\xEAncia: conclus\xE3o que o texto permite, mesmo sem dizer com todas as letras.","Sin\xF4nimo no contexto: troque a palavra na frase e veja se o sentido se mant\xE9m.","Conectivos mostram a rela\xE7\xE3o entre ideias: mas (oposi\xE7\xE3o), portanto (conclus\xE3o), porque (causa), embora (concess\xE3o)."],cai:"Ideia central do texto e sentido de palavras no contexto.",macete:"Volte ao texto para provar cada alternativa. Se n\xE3o d\xE1 para apontar a linha, desconfie."},"Literatura: Quinhentismo ao Arcadismo":{t:["Quinhentismo (1500): Carta de Pero Vaz de Caminha (literatura de informa\xE7\xE3o) e literatura de catequese de Jos\xE9 de Anchieta.","Barroco (in\xEDcio em 1601, Prosopopeia de Bento Teixeira): conflito entre f\xE9 e prazer, ant\xEDteses e paradoxos. Greg\xF3rio de Matos ('Boca do Inferno') e Padre Ant\xF4nio Vieira (Serm\xE3o da Sexag\xE9sima).","Arcadismo (1768, Obras de Cl\xE1udio Manuel da Costa): vida simples no campo, bucolismo, fugere urbem (fugir da cidade), carpe diem (aproveitar o dia), pseud\xF4nimos de pastores.","Autores \xE1rcades: Tom\xE1s Ant\xF4nio Gonzaga (Mar\xEDlia de Dirceu), Bas\xEDlio da Gama (O Uraguai), Santa Rita Dur\xE3o (Caramuru). V\xE1rios ligados \xE0 Inconfid\xEAncia Mineira."],cai:"Autor x escola e caracter\xEDsticas do Barroco e do Arcadismo.",macete:"Barroco = conflito (c\xE9u x terra). Arcadismo = calma no campo."},"Literatura: Romantismo ao Simbolismo":{t:["Romantismo (1836, Suspiros Po\xE9ticos e Saudades, Gon\xE7alves de Magalh\xE3es). 1\xAA gera\xE7\xE3o: nacionalismo e indianismo (Gon\xE7alves Dias, Can\xE7\xE3o do Ex\xEDlio e I-Juca Pirama). 2\xAA gera\xE7\xE3o: ultrarromantismo, mal do s\xE9culo, morte (\xC1lvares de Azevedo). 3\xAA: condoreira, social e abolicionista (Castro Alves, O Navio Negreiro).","Prosa rom\xE2ntica: Jos\xE9 de Alencar (O Guarani, Iracema, Senhora, Luc\xEDola), Joaquim Manuel de Macedo (A Moreninha), Manuel Ant\xF4nio de Almeida (Mem\xF3rias de um Sargento de Mil\xEDcias).","Realismo (1881): Machado de Assis (Mem\xF3rias P\xF3stumas de Br\xE1s Cubas, Dom Casmurro, Quincas Borba). Ironia e an\xE1lise psicol\xF3gica.","Naturalismo (1881, O Mulato): Alu\xEDsio Azevedo (O Corti\xE7o). Determinismo: o ser humano \xE9 produto do meio e da hereditariedade.","Parnasianismo: 'arte pela arte', forma perfeita, soneto. Olavo Bilac, Raimundo Correia, Alberto de Oliveira.","Simbolismo (1893, Missal e Broqu\xE9is, Cruz e Sousa): musicalidade, misticismo, sinestesia. Alphonsus de Guimaraens."],cai:"Gera\xE7\xF5es rom\xE2nticas, Machado de Assis e diferen\xE7a entre Realismo e Naturalismo.",macete:"Naturalismo trata o homem como bicho de laborat\xF3rio (meio + ra\xE7a + momento)."},Col\u00F4nia:{t:["Tratado de Tordesilhas (1494): dividiu as terras entre Portugal e Espanha.","Chegada de Cabral: 1500. Per\xEDodo pr\xE9-colonial (1500-1530): explora\xE7\xE3o do pau-brasil.","Capitanias heredit\xE1rias (1534): terras divididas entre donat\xE1rios. Governo-Geral (1548): Tom\xE9 de Sousa chega em 1549 e funda Salvador, primeira capital.","Economia a\xE7ucareira no Nordeste, com m\xE3o de obra de africanos escravizados. Ciclo do ouro em Minas Gerais no s\xE9culo XVIII; capital passa para o Rio de Janeiro em 1763.","Invas\xF5es holandesas no Nordeste; Batalhas dos Guararapes (1648 e 1649). O 19 de abril (1\xAA Batalha dos Guararapes) \xE9 o Dia do Ex\xE9rcito.","Revoltas nativistas e separatistas: Inconfid\xEAncia Mineira (1789, Tiradentes enforcado em 1792) e Conjura\xE7\xE3o Baiana (1798)."],cai:"Capitanias e Governo-Geral, ciclo do ouro, Guararapes e Inconfid\xEAncia.",macete:"Guararapes = ber\xE7o do Ex\xE9rcito. 19 de abril = Dia do Ex\xE9rcito."},"Independ\xEAncia e Imp\xE9rio":{t:["1808: chegada da Fam\xEDlia Real ao Brasil e abertura dos portos \xE0s na\xE7\xF5es amigas.","7 de setembro de 1822: Independ\xEAncia, D. Pedro I. Primeira Constitui\xE7\xE3o: 1824 (outorgada, com Poder Moderador).","Primeiro Reinado (1822-1831): termina com a abdica\xE7\xE3o de D. Pedro I.","Per\xEDodo Regencial (1831-1840): revoltas como Cabanagem, Sabinada, Balaiada e Farroupilha (1835-1845). Cria\xE7\xE3o da Guarda Nacional (1831).","Segundo Reinado (1840-1889): Golpe da Maioridade (1840), D. Pedro II. Caf\xE9 no Sudeste. Leis abolicionistas: Eus\xE9bio de Queir\xF3s (1850), Ventre Livre (1871), Sexagen\xE1rios (1885), Lei \xC1urea (13/05/1888).","Guerra do Paraguai (1864-1870): Tr\xEDplice Alian\xE7a (Brasil, Argentina, Uruguai) contra o Paraguai de Solano L\xF3pez. Duque de Caxias, patrono do Ex\xE9rcito, comandou as for\xE7as aliadas."],cai:"Datas (1808, 1822, 1824, 1888), Per\xEDodo Regencial e Guerra do Paraguai.",macete:"Caxias = patrono do Ex\xE9rcito. Os\xF3rio = patrono da Cavalaria."},"Rep\xFAblica Velha":{t:["15 de novembro de 1889: Proclama\xE7\xE3o da Rep\xFAblica, Marechal Deodoro da Fonseca. Constitui\xE7\xE3o de 1891.","Rep\xFAblica da Espada (Deodoro e Floriano). Depois, Rep\xFAblica Olig\xE1rquica: pol\xEDtica do caf\xE9 com leite (SP e MG) e pol\xEDtica dos governadores; coronelismo e voto de cabresto.","Revoltas: Canudos (1896-1897, Ant\xF4nio Conselheiro), Revolta da Vacina (1904), Revolta da Chibata (1910), Contestado (1912-1916, PR/SC), tenentismo (anos 1920, Coluna Prestes).","Brasil na 1\xAA Guerra Mundial: declara guerra em 1917, ap\xF3s ataques a navios brasileiros."],cai:"Proclama\xE7\xE3o, caf\xE9 com leite, Canudos e Contestado (que foi no Paran\xE1 e em Santa Catarina).",macete:"Caf\xE9 (SP) com leite (MG) se revezavam na Presid\xEAncia."},"Era Vargas e FEB":{t:["Revolu\xE7\xE3o de 1930: fim da Rep\xFAblica Velha, Get\xFAlio Vargas no poder (1930-1945).","Revolu\xE7\xE3o Constitucionalista de 1932 (SP). Constitui\xE7\xE3o de 1934. Estado Novo (1937-1945): ditadura, Constitui\xE7\xE3o de 1937 ('Polaca').","Trabalhismo: CLT (1943), sal\xE1rio m\xEDnimo (1940). Industrializa\xE7\xE3o: CSN (Volta Redonda, 1941).","2\xAA Guerra Mundial: Brasil entra em 1942 ao lado dos Aliados. A For\xE7a Expedicion\xE1ria Brasileira (FEB) lutou na It\xE1lia (1944-1945): Monte Castelo, Montese, Castelnuovo. Lema: 'A cobra vai fumar'.","Vargas volta eleito em 1951; cria a Petrobras (1953) e se suicida em 1954."],cai:"Estado Novo, CLT, FEB na It\xE1lia e Monte Castelo.",macete:"FEB = It\xE1lia. Monte Castelo foi tomado em fevereiro de 1945."},"Brasil de 1946 aos dias de hoje":{t:["Per\xEDodo democr\xE1tico (1946-1964): Constitui\xE7\xE3o de 1946; JK e o Plano de Metas ('50 anos em 5'); Bras\xEDlia inaugurada em 1960; J\xE2nio renuncia (1961); Jango.","Regime militar (1964-1985): Atos Institucionais; AI-5 (1968) o mais duro; 'milagre econ\xF4mico'; abertura 'lenta, gradual e segura' (Geisel); Lei da Anistia (1979).","Diretas J\xE1 (1984). Tancredo Neves eleito indiretamente (1985), morre; assume Jos\xE9 Sarney.","Constitui\xE7\xE3o de 1988 ('Constitui\xE7\xE3o Cidad\xE3'). Primeira elei\xE7\xE3o direta p\xF3s-regime: 1989 (Collor). Plano Real (1994)."],cai:"AI-5, Diretas J\xE1 e Constitui\xE7\xE3o de 1988.",macete:"1964 come\xE7a, 1968 endurece (AI-5), 1979 anistia, 1985 termina, 1988 nova Constitui\xE7\xE3o."},"Ex\xE9rcito Brasileiro":{t:["Dia do Ex\xE9rcito: 19 de abril (1\xAA Batalha dos Guararapes, 1648).","Patrono do Ex\xE9rcito: Duque de Caxias (Lu\xEDs Alves de Lima e Silva). Dia do Soldado: 25 de agosto (nascimento de Caxias).","Miss\xE3o constitucional das For\xE7as Armadas (CF, art. 142): defesa da P\xE1tria, garantia dos poderes constitucionais e, por iniciativa de qualquer destes, da lei e da ordem. Organizadas com base na hierarquia e na disciplina.","CPOR/NPOR formam oficiais da reserva (R/2). O aluno sai Aspirante a Oficial.","Para a entrevista: saiba a hist\xF3ria da unidade (quartel) do seu NPOR e o nome do comandante."],cai:"Caxias, 19 de abril, art. 142 e hierarquia e disciplina.",macete:"As duas bases das For\xE7as Armadas: HIERARQUIA e DISCIPLINA."},Cartografia:{t:["Escala = dist\xE2ncia no mapa \xF7 dist\xE2ncia real. Escala 1:100.000 \u2192 1 cm no mapa = 100.000 cm = 1 km na realidade.","Escala GRANDE (ex.: 1:1.000) mostra \xE1rea pequena com muito detalhe. Escala PEQUENA (ex.: 1:10.000.000) mostra \xE1rea grande com pouco detalhe.","Latitude: dist\xE2ncia em graus ao norte ou ao sul do Equador (0\xB0 a 90\xB0). Longitude: a leste ou a oeste de Greenwich (0\xB0 a 180\xB0).","Fusos hor\xE1rios: cada 15\xB0 de longitude = 1 hora. A leste, as horas s\xE3o adiantadas; a oeste, atrasadas. O Brasil tem 4 fusos; o hor\xE1rio oficial de Bras\xEDlia \xE9 UTC\u22123.","Rosa dos ventos: pontos cardeais (N, S, L, O), colaterais (NE, SE, SO, NO).","Curvas de n\xEDvel: linhas que ligam pontos de mesma altitude. Curvas muito pr\xF3ximas = terreno \xEDngreme."],cai:"Conta de escala e fusos hor\xE1rios.",macete:"Escala: corte 5 zeros para passar de cm para km (1:500.000 \u2192 1 cm = 5 km)."},"Clima e relevo do Brasil":{t:["Climas: equatorial (quente e \xFAmido, Amaz\xF4nia), tropical (ver\xE3o chuvoso e inverno seco, Brasil central), semi\xE1rido (chuvas escassas e irregulares, sert\xE3o nordestino), tropical atl\xE2ntico (litoral), tropical de altitude (serras do Sudeste) e subtropical (Sul, inverno frio, chuvas bem distribu\xEDdas).","Massas de ar: Equatorial continental (mEc, quente e \xFAmida), Tropical atl\xE2ntica (mTa), Polar atl\xE2ntica (mPa, frentes frias no inverno).","Relevo: predominam planaltos e depress\xF5es; plan\xEDcies como a do Pantanal e a Amaz\xF4nica. Ponto mais alto: Pico da Neblina (AM).","Bacias: Amaz\xF4nica (maior do mundo), do S\xE3o Francisco ('rio da integra\xE7\xE3o nacional'), do Paran\xE1 (maior potencial hidrel\xE9trico instalado, Itaipu)."],cai:"Clima semi\xE1rido, massa polar atl\xE2ntica e bacia do S\xE3o Francisco.",macete:"Frio no Sul = mPa (Polar atl\xE2ntica) entrando pelo sul."},"Biomas e dom\xEDnios":{t:["Biomas (IBGE): Amaz\xF4nia, Cerrado, Caatinga, Mata Atl\xE2ntica, Pampa e Pantanal.","Amaz\xF4nia: maior bioma, floresta equatorial. Cerrado: savana, 'ber\xE7o das \xE1guas', \xE1rvores de troncos retorcidos. Caatinga: \xFAnico exclusivamente brasileiro, vegeta\xE7\xE3o adaptada \xE0 seca (xer\xF3fila).","Mata Atl\xE2ntica: a mais devastada, restam cerca de 12% da \xE1rea original. Pampa: campos do RS. Pantanal: maior plan\xEDcie alag\xE1vel.","Dom\xEDnios morfoclim\xE1ticos (Aziz Ab'S\xE1ber): amaz\xF4nico, cerrados, mares de morros, caatingas, arauc\xE1rias e pradarias, mais as faixas de transi\xE7\xE3o.","Mata de Arauc\xE1rias: t\xEDpica do Paran\xE1 e do Sul, em \xE1reas de clima subtropical e altitude."],cai:"Caatinga exclusiva do Brasil, Mata Atl\xE2ntica mais devastada e Arauc\xE1ria no Sul.",macete:"Ab'S\xE1ber = 6 dom\xEDnios. IBGE = 6 biomas. N\xE3o confunda as listas."},"Popula\xE7\xE3o e economia":{t:["Brasil: mais de 200 milh\xF5es de habitantes, popula\xE7\xE3o majoritariamente urbana (mais de 80%).","Transi\xE7\xE3o demogr\xE1fica: queda da natalidade e da mortalidade, envelhecimento da popula\xE7\xE3o.","\xCAxodo rural: sa\xEDda do campo para a cidade, forte entre 1950 e 1980.","Setores da economia: prim\xE1rio (agropecu\xE1ria e extrativismo), secund\xE1rio (ind\xFAstria) e terci\xE1rio (com\xE9rcio e servi\xE7os, o maior em empregos).","Agroneg\xF3cio: soja, milho, carne, caf\xE9 e cana. Matriz el\xE9trica brasileira: predominantemente renov\xE1vel, com destaque para a hidrel\xE9trica.","Globaliza\xE7\xE3o: integra\xE7\xE3o econ\xF4mica, cultural e tecnol\xF3gica mundial; blocos econ\xF4micos como o Mercosul (1991)."],cai:"Urbaniza\xE7\xE3o, envelhecimento e matriz energ\xE9tica.",macete:"Pir\xE2mide et\xE1ria 'engordando no topo' = popula\xE7\xE3o envelhecendo."},"Territ\xF3rio e regi\xF5es":{t:["Brasil: cerca de 8,5 milh\xF5es de km\xB2, 5\xBA maior pa\xEDs do mundo. Faz fronteira com todos os pa\xEDses da Am\xE9rica do Sul, exceto Chile e Equador.","Regi\xF5es do IBGE: Norte, Nordeste, Centro-Oeste, Sudeste e Sul. 26 Estados + DF.","Maior Estado: Amazonas. Menor: Sergipe.","Regi\xF5es geoecon\xF4micas (complexos regionais): Amaz\xF4nia, Nordeste e Centro-Sul.","Pontos extremos: norte, Monte Cabura\xED (RR); sul, Arroio Chu\xED (RS); leste, Ponta do Seixas (PB); oeste, Serra da Contamana (AC)."],cai:"Fronteiras (Chile e Equador n\xE3o fazem) e regi\xF5es.",macete:"Fronteira: 'Chile e Equador n\xE3o encostam'."},"Reda\xE7\xE3o dissertativa":{t:["Estrutura: introdu\xE7\xE3o (tema + tese), 2 par\xE1grafos de desenvolvimento (um argumento cada, com exemplo, dado ou fato hist\xF3rico) e conclus\xE3o (retoma a tese e fecha).","Impessoalidade: escreva em 3\xAA pessoa. Nada de 'eu acho', 'voc\xEA', g\xEDrias ou apelos emocionais.","Coes\xE3o: use conectivos entre par\xE1grafos (Al\xE9m disso, Por outro lado, Dessa forma, Portanto).","Coer\xEAncia: n\xE3o se contradiga; todos os argumentos defendem a mesma tese.","Treino: 1 reda\xE7\xE3o por semana. Releia em voz alta e corte o que n\xE3o ajuda a tese."],cai:"Avaliam coer\xEAncia, coes\xE3o, clareza, vocabul\xE1rio e impessoalidade.",macete:"Cada par\xE1grafo de desenvolvimento = 1 ideia + 1 prova + 1 liga\xE7\xE3o com a tese."},Entrevista:{t:["Avaliam postura, articula\xE7\xE3o, conhecimento sobre o Ex\xE9rcito e atualidades.","Prepare respostas curtas para: por que quer ser oficial; o que sabe do Ex\xE9rcito; o que sabe da unidade do seu NPOR; seus pontos fortes e fracos; not\xEDcias recentes do Brasil.","Postura: roupa discreta, sentar ereto, olhar nos olhos, responder 'sim, senhor' / 'n\xE3o, senhor', sem g\xEDrias.","Se n\xE3o souber algo, diga que n\xE3o sabe e que vai procurar saber. N\xE3o invente."],cai:"Motiva\xE7\xE3o para ser oficial e conhecimento sobre o Ex\xE9rcito.",macete:"Treine em voz alta, gravando no celular. Ou\xE7a e corte os 'tipo', 'n\xE9', 'a\xED'."}},questoes:[["Sintaxe e reg\xEAncia",2,"Assinale a frase correta quanto \xE0 reg\xEAncia verbal:",["Prefiro estudar a ficar parado.","Prefiro mais estudar do que ficar parado.","Assisti o desfile de 7 de setembro.","Cheguei no quartel \xE0s 6h.","A medida implica em novos custos."],0,"Preferir: uma coisa A outra, sem 'mais' e sem 'do que'. Assistir (ver) pede 'a': assisti AO desfile. Chegar pede 'a': cheguei AO quartel. Implicar (acarretar) n\xE3o pede 'em'.",!0],["Sintaxe e reg\xEAncia",1,"Em 'Os soldados limparam o alojamento', o termo 'o alojamento' \xE9:",["Objeto direto","Objeto indireto","Sujeito","Adjunto adverbial","Aposto"],0,"Complementa 'limparam' sem preposi\xE7\xE3o: objeto direto. O sujeito \xE9 'os soldados'.",!0],["Sintaxe e reg\xEAncia",2,"Em 'Cadete, apresente-se ao comandante', o termo 'Cadete' \xE9:",["Vocativo","Sujeito","Aposto","Objeto direto","Predicativo"],0,"Chamamento, separado por v\xEDrgula: vocativo.",!1],["Sintaxe e reg\xEAncia",2,"Em 'Caxias, patrono do Ex\xE9rcito, nasceu em 1803', o termo 'patrono do Ex\xE9rcito' \xE9:",["Aposto","Vocativo","Objeto direto","Sujeito","Adjunto adverbial"],0,"Explica o termo 'Caxias': aposto explicativo, entre v\xEDrgulas.",!1],["Crase e pontua\xE7\xE3o",1,"Assinale a frase com crase correta:",["O pelot\xE3o chegou \xE0 base \xE0s 5 horas.","Come\xE7amos \xE0 marchar cedo.","Entreguei o relat\xF3rio \xE0 ele.","Fomos \xE0 p\xE9 at\xE9 o rancho.","Obede\xE7a \xE0 regulamentos."],0,"Chegar A + A base = \xE0; \xE0s 5 horas. Sem crase antes de verbo, pronome pessoal, palavra masculina e plural sem artigo.",!0],["Crase e pontua\xE7\xE3o",2,"Assinale a frase corretamente pontuada:",["O sargento, que era experiente, orientou a tropa.","O sargento experiente, orientou a tropa.","O sargento orientou, a tropa.","Os alunos do NPOR, treinam cedo.","Ontem, o sargento orientou, a tropa no p\xE1tio."],0,"Nunca v\xEDrgula entre sujeito e verbo ou entre verbo e complemento. Ora\xE7\xE3o explicativa entre v\xEDrgulas.",!0],["Sem\xE2ntica e interpreta\xE7\xE3o",2,"Em 'A tropa enfrentou a tempestade, CONTUDO cumpriu a miss\xE3o', a palavra destacada pode ser trocada sem mudar o sentido por:",["todavia","portanto","porque","logo","assim"],0,"Contudo e todavia s\xE3o adversativos (oposi\xE7\xE3o).",!0],["Sem\xE2ntica e interpreta\xE7\xE3o",2,"Em uma quest\xE3o de interpreta\xE7\xE3o, a alternativa que deve gerar mais desconfian\xE7a \xE9 aquela que:",["Generaliza com palavras como 'sempre', 'nunca' ou 'todos', sem apoio no texto","Reformula com outras palavras uma ideia presente no texto","Resume o primeiro par\xE1grafo","Usa sin\xF4nimos de palavras do texto","Retoma a conclus\xE3o do autor"],0,"Generaliza\xE7\xF5es extrapolam o texto e costumam ser a pegadinha.",!1],["Literatura: Quinhentismo ao Arcadismo",1,"A Carta de Pero Vaz de Caminha pertence ao:",["Quinhentismo","Barroco","Arcadismo","Romantismo","Realismo"],0,"Literatura de informa\xE7\xE3o dos anos 1500.",!0],["Literatura: Quinhentismo ao Arcadismo",2,"Greg\xF3rio de Matos, o 'Boca do Inferno', \xE9 o principal poeta do:",["Barroco","Arcadismo","Romantismo","Parnasianismo","Simbolismo"],0,"Poesia sat\xEDrica, l\xEDrica e religiosa do Barroco baiano.",!0],["Literatura: Quinhentismo ao Arcadismo",2,"Bucolismo, 'fugere urbem' e 'carpe diem' s\xE3o caracter\xEDsticas do:",["Arcadismo","Barroco","Simbolismo","Naturalismo","Quinhentismo"],0,"O Arcadismo idealiza a vida simples no campo.",!0],["Literatura: Quinhentismo ao Arcadismo",2,"'Mar\xEDlia de Dirceu' \xE9 obra de:",["Tom\xE1s Ant\xF4nio Gonzaga","Cl\xE1udio Manuel da Costa","Greg\xF3rio de Matos","Bas\xEDlio da Gama","Gon\xE7alves Dias"],0,"Gonzaga, \xE1rcade ligado \xE0 Inconfid\xEAncia Mineira.",!1],["Literatura: Romantismo ao Simbolismo",2,"'Can\xE7\xE3o do Ex\xEDlio' ('Minha terra tem palmeiras, / Onde canta o Sabi\xE1') \xE9 de:",["Gon\xE7alves Dias","Castro Alves","\xC1lvares de Azevedo","Olavo Bilac","Cruz e Sousa"],0,"1\xAA gera\xE7\xE3o rom\xE2ntica: nacionalismo e saudade da p\xE1tria.",!0],["Literatura: Romantismo ao Simbolismo",2,"A segunda gera\xE7\xE3o rom\xE2ntica, marcada pelo pessimismo, pela morte e pelo 'mal do s\xE9culo', tem como principal nome:",["\xC1lvares de Azevedo","Castro Alves","Gon\xE7alves Dias","Jos\xE9 de Alencar","Machado de Assis"],0,"Ultrarromantismo: Lira dos Vinte Anos.",!0],["Literatura: Romantismo ao Simbolismo",2,"'O Corti\xE7o', que mostra o ser humano determinado pelo meio, \xE9 obra naturalista de:",["Alu\xEDsio Azevedo","Machado de Assis","Jos\xE9 de Alencar","Raul Pompeia","Olavo Bilac"],0,"Naturalismo = determinismo (meio, ra\xE7a, momento).",!0],["Literatura: Romantismo ao Simbolismo",2,"A poesia preocupada com a forma perfeita, o soneto e a 'arte pela arte' \xE9 caracter\xEDstica do:",["Parnasianismo","Simbolismo","Romantismo","Barroco","Arcadismo"],0,"Olavo Bilac \xE9 o principal nome.",!0],["Literatura: Romantismo ao Simbolismo",2,"O Simbolismo no Brasil come\xE7a em 1893 com a publica\xE7\xE3o de 'Missal' e 'Broqu\xE9is', de:",["Cruz e Sousa","Alphonsus de Guimaraens","Olavo Bilac","Castro Alves","Augusto dos Anjos"],0,"Cruz e Sousa, o 'Cisne Negro'.",!1],["Literatura: Romantismo ao Simbolismo",1,"'Dom Casmurro', com a famosa d\xFAvida sobre Capitu, \xE9 de:",["Machado de Assis","Jos\xE9 de Alencar","Alu\xEDsio Azevedo","Lima Barreto","Graciliano Ramos"],0,"Realismo, 1899.",!1],["Col\xF4nia",1,"O tratado de 1494 que dividiu as terras descobertas e por descobrir entre Portugal e Espanha foi o:",["Tratado de Tordesilhas","Tratado de Madri","Tratado de Utrecht","Tratado de Petr\xF3polis","Tratado de Santo Ildefonso"],0,"Tordesilhas, 1494. Madri (1750) redesenhou as fronteiras pelo uti possidetis.",!0],["Col\xF4nia",2,"Em 1548, para centralizar a administra\xE7\xE3o colonial, Portugal criou:",["O Governo-Geral, com sede em Salvador","As capitanias heredit\xE1rias","O Vice-Reino com sede no Rio de Janeiro","As C\xE2maras Municipais","A Companhia das \xCDndias Ocidentais"],0,"Tom\xE9 de Sousa chegou em 1549 e fundou Salvador. As capitanias s\xE3o de 1534.",!0],["Col\xF4nia",2,"As Batalhas dos Guararapes (1648 e 1649), consideradas o ber\xE7o do Ex\xE9rcito Brasileiro, foram travadas contra:",["Os holandeses","Os franceses","Os espanh\xF3is","Os paraguaios","Os ingleses"],0,"Expuls\xE3o dos holandeses de Pernambuco. 19 de abril = Dia do Ex\xE9rcito.",!0],["Col\xF4nia",2,"A Inconfid\xEAncia Mineira (1789) teve entre suas causas:",["A cobran\xE7a da derrama sobre o ouro em Minas Gerais","A aboli\xE7\xE3o da escravid\xE3o","A chegada da Fam\xEDlia Real","A Guerra do Paraguai","O fim do ciclo do caf\xE9"],0,"A derrama (cobran\xE7a for\xE7ada de impostos atrasados) motivou a conspira\xE7\xE3o. Tiradentes foi enforcado em 1792.",!0],["Col\xF4nia",2,"No s\xE9culo XVIII, com a minera\xE7\xE3o, a capital da col\xF4nia foi transferida de Salvador para:",["Rio de Janeiro","Vila Rica (Ouro Preto)","S\xE3o Paulo","Recife","Bel\xE9m"],0,"Em 1763, para ficar mais perto do escoamento do ouro.",!1],["Independ\xEAncia e Imp\xE9rio",1,"A Independ\xEAncia do Brasil foi proclamada em:",["7 de setembro de 1822","15 de novembro de 1889","22 de abril de 1500","13 de maio de 1888","7 de setembro de 1808"],0,"Por D. Pedro I, \xE0s margens do Ipiranga.",!0],["Independ\xEAncia e Imp\xE9rio",2,"A Constitui\xE7\xE3o de 1824, outorgada por D. Pedro I, criou, al\xE9m dos tr\xEAs Poderes:",["O Poder Moderador","O Poder Eleitoral","O Poder Militar","O Poder Popular","O Poder Regencial"],0,"O Poder Moderador, exercido pelo Imperador, ficava acima dos demais.",!0],["Independ\xEAncia e Imp\xE9rio",2,"A Farroupilha, a Cabanagem, a Sabinada e a Balaiada ocorreram durante:",["O Per\xEDodo Regencial","O Primeiro Reinado","A Rep\xFAblica Velha","A Era Vargas","O Brasil Col\xF4nia"],0,"Reg\xEAncia (1831-1840), per\xEDodo de instabilidade. A Farroupilha durou at\xE9 1845.",!0],["Independ\xEAncia e Imp\xE9rio",2,"Na Guerra do Paraguai (1864-1870), o Brasil fez parte da Tr\xEDplice Alian\xE7a com:",["Argentina e Uruguai","Argentina e Chile","Uruguai e Bol\xEDvia","Chile e Peru","Bol\xEDvia e Argentina"],0,"Contra o Paraguai de Solano L\xF3pez.",!0],["Independ\xEAncia e Imp\xE9rio",1,"O patrono do Ex\xE9rcito Brasileiro \xE9:",["Duque de Caxias","Marechal Deodoro","General Os\xF3rio","Marechal Rondon","Tiradentes"],0,"Lu\xEDs Alves de Lima e Silva. 25 de agosto, seu nascimento, \xE9 o Dia do Soldado.",!0],["Independ\xEAncia e Imp\xE9rio",2,"A lei de 1871 que declarava livres os filhos de escravizadas nascidos a partir de ent\xE3o foi a:",["Lei do Ventre Livre","Lei \xC1urea","Lei Eus\xE9bio de Queir\xF3s","Lei dos Sexagen\xE1rios","Lei de Terras"],0,"Eus\xE9bio de Queir\xF3s (1850) proibiu o tr\xE1fico; Sexagen\xE1rios (1885); Lei \xC1urea (1888) aboliu a escravid\xE3o.",!0],["Independ\xEAncia e Imp\xE9rio",2,"O 'Golpe da Maioridade' (1840) teve como resultado:",["A antecipa\xE7\xE3o da posse de D. Pedro II como imperador","A abdica\xE7\xE3o de D. Pedro I","A Proclama\xE7\xE3o da Rep\xFAblica","A volta de D. Jo\xE3o VI a Portugal","O in\xEDcio da Reg\xEAncia Trina"],0,"Pedro II assumiu com 14 anos, encerrando a Reg\xEAncia.",!1],["Rep\xFAblica Velha",1,"A Rep\xFAblica foi proclamada em 15 de novembro de 1889 por:",["Marechal Deodoro da Fonseca","Floriano Peixoto","Duque de Caxias","Get\xFAlio Vargas","Prudente de Morais"],0,"Deodoro foi o primeiro Presidente.",!0],["Rep\xFAblica Velha",2,"A altern\xE2ncia entre paulistas e mineiros na Presid\xEAncia durante a Rep\xFAblica Velha ficou conhecida como:",["Pol\xEDtica do caf\xE9 com leite","Pol\xEDtica dos governadores","Coronelism r Ae={id:"enem",nome:"ENEM",sub:"Trilha longa \xB7 2027",dataPadrao:"2027-11-07",dataNota:"Data estimada (o ENEM costuma ser no come\xE7o de novembro). Ajuste quando sair o edital.",codigo:"INEP \xB7 ENEM 2027",cor:"enem",materias:[{id:"mat",nome:"Matem\xE1tica",peso:30,gerado:!0},{id:"ling",nome:"Linguagens",peso:20,temas:["Interpreta\xE7\xE3o e g\xEAneros","Varia\xE7\xE3o lingu\xEDstica","Fun\xE7\xF5es da linguagem (ENEM)"]},{id:"hum",nome:"Ci\xEAncias Humanas",peso:20,temas:["Cidadania e direitos","Geografia ambiental"]},{id:"nat",nome:"Ci\xEAncias da Natureza",peso:15,temas:["Ecologia","F\xEDsica do cotidiano","Qu\xEDmica do cotidiano"]},{id:"red",nome:"Reda\xE7\xE3o ENEM",peso:15,temas:["Compet\xEAncias da reda\xE7\xE3o"]}],resumos:{"Interpreta\xE7\xE3o e g\xEAneros":{t:["No ENEM, quase toda quest\xE3o come\xE7a com um texto. Leia primeiro o comando (a pergunta) e depois o texto, j\xE1 sabendo o que procurar.","G\xEAnero textual: a forma social do texto (not\xEDcia, cr\xF4nica, charge, receita, artigo de opini\xE3o). Tipo textual: o modo de organiza\xE7\xE3o (narra\xE7\xE3o, descri\xE7\xE3o, disserta\xE7\xE3o, injun\xE7\xE3o, exposi\xE7\xE3o).","Charge e tirinha: humor cr\xEDtico ligado a um fato atual. Identifique o alvo da cr\xEDtica.","Artigo de opini\xE3o: defende um ponto de vista. Reportagem/not\xEDcia: informa, em tese de forma imparcial."],cai:"Finalidade do texto e efeito de sentido de uma escolha de linguagem.",macete:"Pergunte sempre: quem escreveu, para quem e para qu\xEA?"},"Varia\xE7\xE3o lingu\xEDstica":{t:["Varia\xE7\xE3o regional (diat\xF3pica), social (diastr\xE1tica), hist\xF3rica (diacr\xF4nica) e situacional (diaf\xE1sica, formal x informal).","O ENEM combate o preconceito lingu\xEDstico: n\xE3o existe fala 'errada', existe fala adequada ou inadequada \xE0 situa\xE7\xE3o.","A norma-padr\xE3o \xE9 uma das variedades, exigida em situa\xE7\xF5es formais (como a reda\xE7\xE3o)."],cai:"Reconhecer a varia\xE7\xE3o e o respeito \xE0s diferentes falas.",macete:"Se a alternativa chama uma variedade de 'errada' ou 'feia', ela est\xE1 errada."},"Fun\xE7\xF5es da linguagem (ENEM)":{t:["Referencial (informar), emotiva (sentimentos do emissor), conativa (convencer o receptor), f\xE1tica (testar o canal), metalingu\xEDstica (a linguagem fala de si) e po\xE9tica (foco na forma).","Propaganda = conativa. Poema sobre escrever poema = metalingu\xEDstica."],cai:"Identificar a fun\xE7\xE3o predominante em an\xFAncios e poemas.",macete:"Imperativo + 'voc\xEA' quase sempre = conativa."},"Cidadania e direitos":{t:["Cidadania: direitos civis (liberdade, propriedade), pol\xEDticos (votar e ser votado) e sociais (educa\xE7\xE3o, sa\xFAde, trabalho).","Constitui\xE7\xE3o de 1988: 'Constitui\xE7\xE3o Cidad\xE3', ampliou direitos sociais e garantias.","Movimentos sociais lutam pela amplia\xE7\xE3o de direitos (ex.: movimento negro, feminista, ind\xEDgena)."],cai:"Direitos sociais e papel dos movimentos sociais.",macete:"Civis = liberdade; pol\xEDticos = voto; sociais = bem-estar."},"Geografia ambiental":{t:["Efeito estufa \xE9 natural; o problema \xE9 sua intensifica\xE7\xE3o pela queima de combust\xEDveis f\xF3sseis e pelo desmatamento (aquecimento global).","Ilha de calor: centros urbanos mais quentes que o entorno, pelo asfalto, concreto e pouca vegeta\xE7\xE3o.","Invers\xE3o t\xE9rmica: ar frio fica preso perto do solo, comum no inverno, e concentra a polui\xE7\xE3o.","Desenvolvimento sustent\xE1vel: atender \xE0s necessidades atuais sem comprometer as gera\xE7\xF5es futuras."],cai:"Diferen\xE7a entre efeito estufa (natural) e aquecimento global (intensifica\xE7\xE3o).",macete:"Invers\xE3o t\xE9rmica = 'tampa' de ar quente prendendo o ar frio polu\xEDdo embaixo."},Ecologia:{t:["Cadeia alimentar: produtores (fazem fotoss\xEDntese) \u2192 consumidores prim\xE1rios \u2192 secund\xE1rios... Decompositores reciclam a mat\xE9ria.","A energia diminui a cada n\xEDvel tr\xF3fico (cerca de 10% passa adiante); a mat\xE9ria circula.","Rel
